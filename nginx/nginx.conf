# DoctorPet 무중단 배포용 nginx 설정. docs/architecture/DoctorPet-무중단배포.md 참고.
#
# 이 파일은 정적이라 git으로 추적한다 — 배포마다 바뀌는 건 conf.d/upstream-active.conf 하나뿐이고,
# 그 파일만 배포 스크립트가 덮어쓴다(git 비추적, .gitignore 참고).
#
# 컷오버는 이 파일 자체를 바꾸는 게 아니라 conf.d/upstream-active.conf의 upstream 대상(blue/green)만
# 바꾸고 `nginx -s reload`하는 방식이다 — reload는 그레이스풀해서 기존 연결은 이전 업스트림으로
# 마저 처리되고 새 연결부터 바뀐 업스트림으로 붙는다(무중단 컷오버의 핵심).
#
# 도메인·HTTPS(doctorpet.click, Let's Encrypt) — 무중단배포 문서 3-1절이 "지금은 도메인·인증서가
# 없어 범위 밖"이라고 명시하며 "나중에 server_name·listen 443 ssl만 추가하면 된다"고 예고해둔
# 그 시점이 왔다. 80/443 서버 블록을 추가했다. 인증서 발급·갱신 절차는 docker-compose.yml의
# certbot 서비스, 최초 1회 발급·갱신 자동화는 문서 3-1절 참고.
#
# (리뷰 지적 P1 반영) 8080은 포트 자체는 유지하지만(기존에 http://EC2 IP:8080로 접근하던 경로를
# 당장 끊지 않기 위함) 더 이상 앱으로 평문 프록시하지 않는다 — HTTPS를 붙인 목적(전송 구간 보호)이
# 8080이 그대로 평문으로 JWT·결제 요청을 처리할 수 있는 한 무력화되기 때문이다. 대신 아래 8080
# 서버 블록은 모든 요청을 https://doctorpet.click로 리다이렉트만 한다 — 요청 본문·메서드가 그대로
# 보존되도록 307(Temporary Redirect, 301/302와 달리 POST를 GET으로 바꾸지 않는다)을 쓴다. 8080으로
# 들어오는 요청 자체(헤더·바디)가 클라이언트→nginx 구간에서 이미 평문으로 오간다는 점은 리다이렉트로
# 막을 수 없지만, 적어도 nginx가 그 요청을 백엔드로 그대로 넘겨 응답 본문(토큰, 결제 정보 등)까지
# 평문으로 돌려주는 것은 막는다. 클라이언트가 전부 도메인으로 전환된 게 확인되면 포트와 이 서버
# 블록 자체를 제거할 것 — 지금은 과도기 조치다.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # conf.d/upstream-active.conf가 여기서 http 블록 안으로 include된다. 이 파일은 배포 스크립트가
    # 매 컷오버마다 다시 써서 `upstream app_upstream { server app-blue:8080 | app-green:8080; }` 중
    # 하나만 담는다. 로컬 개발 시에는 conf.d/upstream-active.conf.example을
    # conf.d/upstream-active.conf로 복사해서 쓴다.
    include /etc/nginx/conf.d/*.conf;

    # 프록시 요청/응답 로그를 최소한으로만 남긴다 — 민감정보(토큰 등)는 access_log 형식에
    # 포함하지 않는다(AGENTS.md 보안 절, 로그에 인증정보 남기지 않기와 동일 원칙).
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 8080;

        # (리뷰 지적 P1 반영) 더 이상 app_upstream으로 프록시하지 않는다 — 위 파일 상단 주석 참고.
        # 307은 메서드·바디를 그대로 유지한 채 리다이렉트하므로, 아직 http://EC2 IP:8080으로 직접
        # 요청을 보내는 클라이언트(예: 도메인 전환 전 하드코딩된 모바일 빌드)가 있어도 POST 요청이
        # GET으로 바뀌어 깨지는 일이 없다 — 다만 그 클라이언트가 리다이렉트를 따라가려면 여전히
        # HTTPS로 재요청해야 하므로, 결국 클라이언트도 도메인 전환이 끝나야 정상 동작한다.
        location / {
            return 307 https://doctorpet.click$request_uri;
        }
    }

    # ACME HTTP-01 챌린지 + HTTPS로 리다이렉트. certbot(docker-compose.yml)이 --webroot로
    # /var/www/certbot 밑에 챌린지 파일을 쓰면 여기서 그대로 서빙한다 — 이 location만 예외로
    # 두고 그 외 모든 요청은 443으로 넘긴다(챌린지 도중에도 평문 8080/80으로 API가 새어나가지
    # 않도록).
    server {
        listen 80;
        server_name doctorpet.click;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # 리뷰 지적(P2, 하드닝) — $host는 클라이언트가 보낸 Host 헤더를 그대로 쓰는 것이라,
            # 이 서버 블록이 doctorpet.click 요청만 매칭하는 한 브라우저가 임의 Host를 실어 보낼
            # 수 없어 실질 악용 가능성은 낮지만, 이 서버 블록의 목적지 자체가 doctorpet.click으로
            # 고정돼 있으므로 굳이 변수에 의존하지 않고 호스트를 하드코딩하는 편이 더 안전하고
            # 의도도 명확하다.
            return 301 https://doctorpet.click$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name doctorpet.click;

        # 리뷰 지적(P2, 하드닝) — ssl_protocols를 지정하지 않으면 nginx 빌드 기본값에 의존하게
        # 되는데, 이번에 HTTPS를 처음 도입하는 만큼 전송 구간 보호라는 목적에 맞게 최신 프로토콜만
        # 명시적으로 못박아둔다(TLSv1/1.1 등 구버전 배제).
        ssl_protocols TLSv1.2 TLSv1.3;

        # docker-compose.yml의 nginx entrypoint가 이 경로에 실제 인증서가 없으면(최초 부팅,
        # certbot이 아직 한 번도 성공하지 못한 상태) 자체 서명 임시 인증서를 먼저 만들어 둔다 —
        # 그래야 이 서버 블록 자체가 nginx 설정 검증(nginx -t)을 통과해 nginx가 뜰 수 있고,
        # 그래야 위 80 서버 블록의 ACME 챌린지도 응답할 수 있어 certbot이 실제 인증서를 발급받을
        # 최초 기회 자체가 생긴다(닭과 달걀 문제). certbot이 발급에 성공하면 같은 경로의 파일을
        # 실제 인증서로 교체하고, `nginx -s reload`로 반영한다 — 이 파일 경로 자체는 바뀌지
        # 않으므로 nginx.conf를 다시 손댈 필요가 없다.
        ssl_certificate /etc/letsencrypt/live/doctorpet.click/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/doctorpet.click/privkey.pem;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 아래 세 location은 위 8080 서버 블록과 동일하다(SSE 버퍼링 끄기 등 같은 이유) — 8080을
        # 완전히 걷어낼 때 하나로 합칠 수 있다.
        location /api/notifications/subscribe {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /ws/chat {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # PortOne 모바일 빌링키 콜백은 query에 원문 빌링키가 들어올 수 있다. 앱은 처리 직후
        # 원문 없는 결과 URL로 302하지만, nginx access log에는 요청 URI가 남으므로 이 경로는
        # 접근 로그 자체를 남기지 않는다. 오류 로그에도 원문을 기록하는 로깅을 추가하지 말 것.
        location ~ ^/api/payment-methods/billing-key-issues/[^/]+/callback$ {
            access_log off;
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
