# DoctorPet 무중단 배포용 nginx 설정. docs/architecture/DoctorPet-무중단배포.md 참고.
#
# 이 파일은 정적이라 git으로 추적한다 — 배포마다 바뀌는 건 conf.d/upstream-active.conf 하나뿐이고,
# 그 파일만 배포 스크립트가 덮어쓴다(git 비추적, .gitignore 참고).
#
# 컷오버는 이 파일 자체를 바꾸는 게 아니라 conf.d/upstream-active.conf의 upstream 대상(blue/green)만
# 바꾸고 `nginx -s reload`하는 방식이다 — reload는 그레이스풀해서 기존 연결은 이전 업스트림으로
# 마저 처리되고 새 연결부터 바뀐 업스트림으로 붙는다(무중단 컷오버의 핵심).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # conf.d/upstream-active.conf가 여기서 http 블록 안으로 include된다. 이 파일은 배포 스크립트가
    # 매 컷오버마다 다시 써서 `upstream app_upstream { server app-blue:8080 | app-green:8080; }` 중
    # 하나만 담는다. 로컬 개발 시에는 conf.d/upstream-active.conf.example을
    # conf.d/upstream-active.conf로 복사해서 쓴다.
    include /etc/nginx/conf.d/*.conf;

    # 프록시 요청/응답 로그를 최소한으로만 남긴다 — 민감정보(토큰 등)는 access_log 형식에
    # 포함하지 않는다(AGENTS.md 보안 절, 로그에 인증정보 남기지 않기와 동일 원칙).
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 8080;

        # 프록시 대상이 다운돼 있는 짧은 순간(컷오버 직후 등)에도 커넥션 자체를 오래 붙잡지 않도록
        # 타임아웃을 짧게 둔다 — 앱 자체 응답 시간(P95 300ms 목표)보다 넉넉하되 무한 대기는 피한다.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # SSE 구독 경로(리뷰 지적) — 알림 스트림은 connected·ping·notification 같은 작은
        # 청크를 그때그때 보내는데, 아래 location /의 nginx 기본 proxy_buffering on이
        # 그대로 적용되면 버퍼가 찰 때까지 클라이언트에 전달되지 않아 SseEmitter가 사실상
        # 실시간으로 동작하지 않는다. 이 location을 location / 보다 먼저 둬 더 구체적인
        # prefix가 매치되게 하고, 여기서만 버퍼링·프록시 캐시를 끈다. 애플리케이션도
        # X-Accel-Buffering: no 헤더를 함께 보낸다(NotificationSubscriptionController) —
        # 이 location 매칭이 나중에 달라져도 이중으로 안전하다.
        location /api/notifications/subscribe {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            # SSE는 장시간 열려 있는 연결이라 다른 API보다 읽기 타임아웃을 넉넉히 둔다 —
            # 짧으면 정상 구독 중에도 nginx가 연결을 끊어버린다.
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
