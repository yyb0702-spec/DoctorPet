<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
<title id="title">DoctorPet 결제 알림 플로우</title><desc id="desc">청구 항목, 결제 상태 전이, 환불과 알림 저장 및 SSE 전달</desc>
<defs><style>.title{font:700 38px 'Malgun Gothic',sans-serif}.head{font:700 22px 'Malgun Gothic',sans-serif}.node{font:600 19px 'Malgun Gothic',sans-serif;text-anchor:middle}.sub{font:500 15px 'Malgun Gothic',sans-serif;text-anchor:middle}.label{font:600 15px 'Malgun Gothic',sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2.2}.line{fill:none;stroke:#000;stroke-width:2.6;marker-end:url(#arrow)}.sep{stroke:#000;stroke-width:1.5;stroke-dasharray:7 8}</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z"/></marker></defs>
<rect width="1800" height="1220" fill="#fff"/><text x="70" y="70" class="title">DoctorPet 결제 · 알림 플로우</text><text x="70" y="130" class="head">1. 청구와 결제 상태</text>
<rect x="80" y="180" width="320" height="78" rx="10" class="box"/><text x="240" y="214" class="node">진료 완료 후 청구 항목 작성</text><text x="240" y="240" class="sub">결제 선기록 전까지만 수정</text><path d="M400 219H480" class="line"/><rect x="480" y="180" width="300" height="78" rx="10" class="box"/><text x="630" y="214" class="node">서버가 항목 합계 산출</text><text x="630" y="240" class="sub">총액 0 초과·상한 검증</text><path d="M780 219H860" class="line"/><rect x="860" y="180" width="250" height="78" rx="10" class="box"/><text x="985" y="227" class="node">PENDING 선기록</text><path d="M1110 219H1190" class="line"/><polygon points="1320,156 1450,219 1320,282 1190,219" class="box"/><text x="1320" y="225" class="node">자동 결제 결과</text><path d="M1450 219H1530" class="line"/><text x="1470" y="198" class="label">성공</text><rect x="1530" y="180" width="190" height="78" rx="10" class="box"/><text x="1625" y="227" class="node">PAID</text>
<path d="M1320 282V355" class="line"/><text x="1342" y="330" class="label">일시 실패·결과 미확정</text><rect x="1120" y="370" width="400" height="78" rx="10" class="box"/><text x="1320" y="404" class="node">PENDING 유지·단건 조회·재시도</text><text x="1320" y="430" class="sub">승인 여부가 불확실하면 자동 수납 금지</text><path d="M1120 409H1040" class="line"/><polygon points="910,346 1040,409 910,472 780,409" class="box"/><text x="910" y="415" class="node">정산 결과 확정?</text><path d="M910 346V305H1625V258" class="line"/><text x="935" y="325" class="label">PAID</text>
<path d="M910 472V545" class="line"/><text x="932" y="520" class="label">실패·재시도 소진</text><rect x="710" y="560" width="400" height="78" rx="10" class="box"/><text x="910" y="594" class="node">OFFLINE_REQUIRED</text><text x="910" y="620" class="sub">병원 현장 수납 필요</text><path d="M710 599H630" class="line"/><rect x="330" y="560" width="300" height="78" rx="10" class="box"/><text x="480" y="594" class="node">OFFLINE_PAID</text><text x="480" y="620" class="sub">현장 수납 정산</text><path d="M1625 258V520" class="line"/><text x="1645" y="395" class="label">전액 환불</text><rect x="1510" y="535" width="230" height="78" rx="10" class="box"/><text x="1625" y="582" class="node">REFUNDED</text>
<path d="M70 700H1730" class="sep"/><text x="70" y="752" class="head">2. 알림 저장과 실시간 전달</text>
<rect x="80" y="800" width="340" height="78" rx="10" class="box"/><text x="250" y="834" class="node">예약·결제 상태 전이 성공</text><text x="250" y="860" class="sub">승인·거절·노쇼·결제 결과</text><path d="M420 839H500" class="line"/><rect x="500" y="800" width="320" height="78" rx="10" class="box"/><text x="660" y="834" class="node">NotificationService.create</text><text x="660" y="860" class="sub">상태 전이 트랜잭션에 저장</text><path d="M820 839H900" class="line"/><rect x="900" y="800" width="280" height="78" rx="10" class="box"/><text x="1040" y="834" class="node">notifications 저장</text><text x="1040" y="860" class="sub">목록·읽음 처리 가능</text><path d="M1180 839H1260" class="line"/><rect x="1260" y="800" width="350" height="78" rx="10" class="box"/><text x="1435" y="834" class="node">커밋 후 SSE 전달</text><text x="1435" y="860" class="sub">현재 발행된 보호자 수신 알림</text>
<path d="M1435 878V980H860" class="line"/><text x="1080" y="968" class="label">SSE 연결 없음·전송 실패</text><rect x="560" y="930" width="300" height="78" rx="10" class="box"/><text x="710" y="964" class="node">저장된 알림 목록 재조회</text><text x="710" y="990" class="sub">전달 실패에도 데이터 보존</text>
</svg>
