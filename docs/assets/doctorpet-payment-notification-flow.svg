<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">DoctorPet 결제 알림 플로우</title><desc id="desc">청구 항목, 결제 상태 전이, 환불과 알림 저장 및 SSE 전달</desc>
<defs><style>.t{font:700 36px 'Malgun Gothic',sans-serif}.h{font:700 21px 'Malgun Gothic',sans-serif}.n{font:600 19px 'Malgun Gothic',sans-serif;text-anchor:middle}.s{font:500 15px 'Malgun Gothic',sans-serif;text-anchor:middle}.l{font:600 15px 'Malgun Gothic',sans-serif}.b{fill:#fff;stroke:#000;stroke-width:2.2}.d{fill:#fff;stroke:#000;stroke-width:2.2}.e{fill:none;stroke:#000;stroke-width:2.6;marker-end:url(#a)}.x{stroke:#000;stroke-dasharray:6 7}</style><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z"/></marker></defs>
<rect width="1600" height="1180" fill="#fff"/><text x="70" y="68" class="t">DoctorPet 결제 · 알림 플로우</text>
<text x="70" y="125" class="h">1. 청구와 결제 상태</text>
<rect x="90" y="170" width="300" height="76" rx="10" class="b"/><text x="240" y="204" class="n">진료 완료 후 청구 항목 작성</text><text x="240" y="230" class="s">결제 선기록 전까지만 수정</text><path d="M390 208H450" class="e"/>
<rect x="450" y="170" width="290" height="76" rx="10" class="b"/><text x="595" y="204" class="n">서버가 항목 합계 산출</text><text x="595" y="230" class="s">총액 0 초과·상한 검증</text><path d="M740 208H800" class="e"/>
<rect x="800" y="170" width="270" height="76" rx="10" class="b"/><text x="935" y="216" class="n">PENDING 선기록</text><path d="M1070 208H1130" class="e"/>
<polygon points="1250,145 1370,208 1250,271 1130,208" class="d"/><text x="1250" y="214" class="n">자동 결제 결과</text>
<path d="M1370 208H1430" class="e"/><text x="1385" y="187" class="l">성공</text><rect x="1430" y="170" width="160" height="76" rx="10" class="b"/><text x="1510" y="216" class="n">PAID</text>
<path d="M1250 271V350" class="e"/><text x="1268" y="330" class="l">일시 실패·결과 미확정</text><rect x="1080" y="360" width="340" height="76" rx="10" class="b"/><text x="1250" y="394" class="n">PENDING 유지·단건 조회·재시도</text><text x="1250" y="420" class="s">승인 여부가 불확실하면 자동 수납 금지</text>
<path d="M1080 398H1020" class="e"/><polygon points="900,335 1020,398 900,461 780,398" class="d"/><text x="900" y="404" class="n">정산 결과</text>
<path d="M900 335V295H1510V246" class="e"/><text x="925" y="316" class="l">PAID</text>
<path d="M900 461V530" class="e"/><text x="918" y="510" class="l">실패·재시도 소진</text><rect x="735" y="540" width="330" height="76" rx="10" class="b"/><text x="900" y="574" class="n">OFFLINE_REQUIRED</text><text x="900" y="600" class="s">병원 현장 수납 필요</text><path d="M735 578H650" class="e"/><rect x="390" y="540" width="250" height="76" rx="10" class="b"/><text x="515" y="574" class="n">OFFLINE_PAID</text><text x="515" y="600" class="s">현장 수납 정산</text>
<path d="M1510 246V460" class="e"/><text x="1528" y="330" class="l">전액 환불</text><rect x="1380" y="470" width="210" height="76" rx="10" class="b"/><text x="1485" y="516" class="n">REFUNDED</text>
<path d="M80 700H1520" class="x"/>
<text x="70" y="750" class="h">2. 알림 저장과 실시간 전달</text>
<rect x="90" y="795" width="310" height="76" rx="10" class="b"/><text x="245" y="829" class="n">예약·결제 상태 전이 성공</text><text x="245" y="855" class="s">승인·거절·노쇼·결제 결과</text><path d="M400 833H460" class="e"/>
<rect x="460" y="795" width="300" height="76" rx="10" class="b"/><text x="610" y="829" class="n">NotificationService.create</text><text x="610" y="855" class="s">상태 전이 트랜잭션에 저장</text><path d="M760 833H820" class="e"/>
<rect x="820" y="795" width="260" height="76" rx="10" class="b"/><text x="950" y="829" class="n">notifications 저장</text><text x="950" y="855" class="s">목록·읽음 처리 가능</text><path d="M1080 833H1140" class="e"/>
<rect x="1140" y="795" width="320" height="76" rx="10" class="b"/><text x="1300" y="829" class="n">커밋 후 SSE 전달</text><text x="1300" y="855" class="s">현재 발행된 보호자 수신 알림</text>
<rect x="460" y="940" width="300" height="76" rx="10" class="b"/><text x="610" y="974" class="n">SSE 연결 없음·전송 실패</text><text x="610" y="1000" class="s">저장된 알림 목록으로 재조회</text><path d="M1140 871V978H760" class="e"/>
