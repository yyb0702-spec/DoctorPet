<path d="M810 271V330" class="e"/><text x="828" y="310" class="l">실패</text><rect x="655" y="340" width="310" height="76" rx="10" class="b"/><text x="810" y="386" class="n">실패 횟수 누적</text><path d="M965 378H1025" class="e"/>
<polygon points="1135,315 1245,378 1135,441 1025,378" class="d"/><text x="1135" y="384" class="n">5회 연속?</text>
<path d="M1245 378H1305" class="e"/><text x="1260" y="357" class="l">예</text><rect x="1305" y="340" width="220" height="76" rx="10" class="b"/><text x="1415" y="374" class="n">계정 잠금</text><text x="1415" y="400" class="s">30분 후 자동 해제</text>
<path d="M1135 441V500" class="e"/><text x="1153" y="480" class="l">비밀번호 재설정</text><rect x="980" y="510" width="310" height="76" rx="10" class="b"/><text x="1135" y="544" class="n">이메일 인증 후 비밀번호 변경</text><text x="1135" y="570" class="s">성공 시 잠금 해제·세션 폐기</text>
<path d="M980 548H875V208H700" class="e"/>
<path d="M80 635H1520" class="x"/>
<text x="70" y="685" class="h">2. 반려동물 프로필</text>
<rect x="90" y="730" width="250" height="76" rx="10" class="b"/><text x="215" y="776" class="n">프로필 등록·수정</text><path d="M340 768H400" class="e"/>
<rect x="400" y="730" width="300" height="76" rx="10" class="b"/><text x="550" y="764" class="n">이름·종·건강 정보 저장</text><text x="550" y="790" class="s">다마리 등록 가능</text><path d="M700 768H760" class="e"/>
<rect x="760" y="730" width="330" height="76" rx="10" class="b"/><text x="925" y="764" class="n">선택 사진: Presigned URL</text><text x="925" y="790" class="s">클라이언트 S3 직접 업로드</text><path d="M1090 768H1150" class="e"/>
