<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
<title id="title">DoctorPet 인증 회원 프로필 플로우</title><desc id="desc">로그인 잠금, 비밀번호 재설정, 단일 세션, 반려동물 프로필과 탈퇴 흐름</desc>
<defs><style>.title{font:700 38px 'Malgun Gothic',sans-serif}.head{font:700 22px 'Malgun Gothic',sans-serif}.node{font:600 19px 'Malgun Gothic',sans-serif;text-anchor:middle}.sub{font:500 15px 'Malgun Gothic',sans-serif;text-anchor:middle}.label{font:600 15px 'Malgun Gothic',sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2.2}.line{fill:none;stroke:#000;stroke-width:2.6;marker-end:url(#arrow)}.sep{stroke:#000;stroke-width:1.5;stroke-dasharray:7 8}</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z"/></marker></defs>
<rect width="1800" height="1220" fill="#fff"/><text x="70" y="70" class="title">DoctorPet 인증 · 회원 · 프로필 플로우</text>
<text x="70" y="130" class="head">1. 로그인 · 잠금 · 비밀번호 재설정</text>
<rect x="80" y="180" width="230" height="78" rx="10" class="box"/><text x="195" y="227" class="node">로그인 요청</text><path d="M310 219H380" class="line"/>
<rect x="380" y="180" width="280" height="78" rx="10" class="box"/><text x="520" y="227" class="node">이메일·비밀번호 검증</text><path d="M660 219H730" class="line"/>
<polygon points="850,156 970,219 850,282 730,219" class="box"/><text x="850" y="225" class="node">성공?</text><path d="M970 219H1040" class="line"/><text x="990" y="198" class="label">성공</text>
<rect x="1040" y="180" width="360" height="78" rx="10" class="box"/><text x="1220" y="214" class="node">단일 Refresh 세션 발급</text><text x="1220" y="240" class="sub">새 로그인 시 기존 세션 종료</text>
<path d="M850 282V355" class="line"/><text x="872" y="330" class="label">실패</text><rect x="670" y="370" width="300" height="78" rx="10" class="box"/><text x="820" y="417" class="node">실패 횟수 누적</text><path d="M970 409H1040" class="line"/>
<polygon points="1160,346 1280,409 1160,472 1040,409" class="box"/><text x="1160" y="415" class="node">5회 연속?</text><path d="M1280 409H1350" class="line"/><text x="1300" y="388" class="label">예</text><rect x="1350" y="370" width="280" height="78" rx="10" class="box"/><text x="1490" y="404" class="node">계정 잠금</text><text x="1490" y="430" class="sub">30분 후 자동 해제</text>
<path d="M1160 472V545" class="line"/><text x="1182" y="520" class="label">비밀번호 재설정</text><rect x="980" y="560" width="360" height="78" rx="10" class="box"/><text x="1160" y="594" class="node">이메일 인증 후 비밀번호 변경</text><text x="1160" y="620" class="sub">성공 시 잠금 해제·세션 폐기</text>
<path d="M980 599H820V498H520V258" class="line"/><text x="650" y="485" class="label">재로그인</text>
<path d="M70 690H1730" class="sep"/><text x="70" y="742" class="head">2. 반려동물 프로필</text>
<rect x="80" y="790" width="270" height="78" rx="10" class="box"/><text x="215" y="837" class="node">프로필 등록·수정</text><path d="M350 829H425" class="line"/><rect x="425" y="790" width="320" height="78" rx="10" class="box"/><text x="585" y="824" class="node">이름·종·건강 정보 저장</text><text x="585" y="850" class="sub">다마리 등록 가능</text><path d="M745 829H820" class="line"/><rect x="820" y="790" width="360" height="78" rx="10" class="box"/><text x="1000" y="824" class="node">선택 사진: Presigned URL</text><text x="1000" y="850" class="sub">클라이언트 S3 직접 업로드</text><path d="M1180 829H1255" class="line"/><rect x="1255" y="790" width="300" height="78" rx="10" class="box"/><text x="1405" y="837" class="node">사진 URL만 저장</text>
<path d="M70 925H1730" class="sep"/><text x="70" y="977" class="head">3. 회원 탈퇴</text>
<rect x="80" y="1025" width="240" height="78" rx="10" class="box"/><text x="200" y="1072" class="node">탈퇴 요청</text><path d="M320 1064H400" class="line"/><polygon points="555,1001 710,1064 555,1127 400,1064" class="box"/><text x="555" y="1058" class="node">활성 예약 또는</text><text x="555" y="1082" class="sub">미수금 존재?</text><path d="M710 1064H790" class="line"/><text x="730" y="1043" class="label">예</text><rect x="790" y="1025" width="270" height="78" rx="10" class="box"/><text x="925" y="1072" class="node">409 탈퇴 보류</text>
<path d="M555 1127V1160H1320V1103" class="line"/><text x="580" y="1153" class="label">아니오</text><rect x="1140" y="1025" width="360" height="78" rx="10" class="box"/><text x="1320" y="1059" class="node">Soft Delete·이메일 익명화</text><text x="1320" y="1085" class="sub">전화번호·찜·세션 정리</text>
</svg>
