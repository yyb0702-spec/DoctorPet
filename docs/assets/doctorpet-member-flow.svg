<rect x="390" y="170" width="250" height="76" rx="10" class="b"/><text x="515" y="216" class="n">이메일·비밀번호 검증</text><path d="M640 208H700" class="e"/>
<polygon points="810,145 920,208 810,271 700,208" class="d"/><text x="810" y="214" class="n">성공?</text>
