<text x="70" y="680" class="h">3. AI 상담 기반 검색</text>
<rect x="90" y="725" width="260" height="76" rx="10" class="b"/><text x="220" y="771" class="n">증상·선택 위치 입력</text><path d="M350 763H410" class="e"/>
<rect x="410" y="725" width="270" height="76" rx="10" class="b"/><text x="545" y="759" class="n">개인정보 패턴 마스킹</text><text x="545" y="785" class="s">입력 길이·요청 횟수 제한</text><path d="M680 763H740" class="e"/>
<rect x="740" y="725" width="270" height="76" rx="10" class="b"/><text x="875" y="759" class="n">AI Gateway</text><text x="875" y="785" class="s">진단·처방 문구 생성 금지</text><path d="M1010 763H1070" class="e"/>
<rect x="1070" y="725" width="300" height="76" rx="10" class="b"/><text x="1220" y="759" class="n">제한된 검색 Tool 호출</text><text x="1220" y="785" class="s">역량·거리·영업 조건만 변환</text>
<path d="M1220 801V875H1160V486" class="e"/><text x="1238" y="850" class="l">구조화 조건으로 검색 재사용</text>
<path d="M875 801V925H520" class="e"/><text x="680" y="906" class="l">Tool 실패: 서버 고정 안내·직접 검색 유도</text><rect x="350" y="935" width="340" height="76" rx="10" class="b"/><text x="520" y="969" class="n">fallback=true 응답</text><text x="520" y="995" class="s">사용자가 검색 조건을 직접 조정</text>
</svg>
