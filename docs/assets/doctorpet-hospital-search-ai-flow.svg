<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
<title id="title">DoctorPet 병원 검색 공공데이터 AI 플로우</title><desc id="desc">공공데이터 적재와 병원 검색, AI 안전 검색 도구 흐름</desc>
<defs><style>.title{font:700 38px 'Malgun Gothic',sans-serif}.head{font:700 22px 'Malgun Gothic',sans-serif}.node{font:600 19px 'Malgun Gothic',sans-serif;text-anchor:middle}.sub{font:500 15px 'Malgun Gothic',sans-serif;text-anchor:middle}.label{font:600 15px 'Malgun Gothic',sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2.2}.line{fill:none;stroke:#000;stroke-width:2.6;marker-end:url(#arrow)}.sep{stroke:#000;stroke-width:1.5;stroke-dasharray:7 8}</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z"/></marker></defs>
<rect width="1800" height="1160" fill="#fff"/><text x="70" y="70" class="title">DoctorPet 병원 · 검색 · 공공데이터 · AI 플로우</text>
<text x="70" y="130" class="head">1. 공공데이터와 병원 운영 상태</text>
<rect x="80" y="180" width="290" height="78" rx="10" class="box"/><text x="225" y="214" class="node">전국 동물병원 공공데이터</text><text x="225" y="240" class="sub">초기 적재·주기 갱신</text><path d="M370 219H450" class="line"/><rect x="450" y="180" width="310" height="78" rx="10" class="box"/><text x="605" y="214" class="node">정규화·WGS84 좌표 변환</text><text x="605" y="240" class="sub">유효 데이터만 반영</text><path d="M760 219H840" class="line"/><rect x="840" y="180" width="300" height="78" rx="10" class="box"/><text x="990" y="214" class="node">병원·상세·역량 Upsert</text><text x="990" y="240" class="sub">제휴 정보 보강</text><path d="M1140 219H1220" class="line"/><rect x="1220" y="180" width="380" height="78" rx="10" class="box"/><text x="1410" y="214" class="node">영업·휴업·폐업 상태 반영</text><text x="1410" y="240" class="sub">예약 가능 여부의 서버 기준</text>
<path d="M70 320H1730" class="sep"/><text x="70" y="372" class="head">2. 직접 검색</text>
<rect x="80" y="420" width="250" height="78" rx="10" class="box"/><text x="205" y="467" class="node">검색 조건 입력</text><path d="M330 459H410" class="line"/><polygon points="540,396 670,459 540,522 410,459" class="box"/><text x="540" y="465" class="node">기본 첫 페이지?</text><path d="M670 459H750" class="line"/><text x="690" y="438" class="label">예</text><rect x="750" y="420" width="280" height="78" rx="10" class="box"/><text x="890" y="467" class="node">Redis 검색 캐시 확인</text><path d="M1030 459H1110" class="line"/><text x="1045" y="438" class="label">미스</text><rect x="1110" y="420" width="310" height="78" rx="10" class="box"/><text x="1265" y="467" class="node">QueryDSL 조건 검색</text><path d="M1420 459H1500" class="line"/><rect x="1500" y="420" width="210" height="78" rx="10" class="box"/><text x="1605" y="467" class="node">목록 응답</text>
<path d="M890 498V570H1605V498" class="line"/><text x="1180" y="558" class="label">캐시 저장 후 동일 응답</text>
<path d="M70 630H1730" class="sep"/><text x="70" y="682" class="head">3. AI 상담 기반 검색</text>
<rect x="80" y="730" width="270" height="78" rx="10" class="box"/><text x="215" y="777" class="node">증상·선택 위치 입력</text><path d="M350 769H430" class="line"/><rect x="430" y="730" width="290" height="78" rx="10" class="box"/><text x="575" y="764" class="node">개인정보 패턴 마스킹</text><text x="575" y="790" class="sub">입력 길이·요청 횟수 제한</text><path d="M720 769H800" class="line"/><rect x="800" y="730" width="270" height="78" rx="10" class="box"/><text x="935" y="764" class="node">AI Gateway</text><text x="935" y="790" class="sub">진단·처방 문구 생성 금지</text><path d="M1070 769H1150" class="line"/><rect x="1150" y="730" width="320" height="78" rx="10" class="box"/><text x="1310" y="764" class="node">제한된 검색 Tool 호출</text><text x="1310" y="790" class="sub">역량·거리·영업 조건만 변환</text>
<path d="M1310 808V875H1265V498" class="line"/><text x="1330" y="855" class="label">구조화 조건으로 검색 재사용</text><path d="M935 808V930H590V895" class="line"/><text x="690" y="920" class="label">Tool 실패</text><rect x="420" y="830" width="340" height="78" rx="10" class="box"/><text x="590" y="864" class="node">fallback=true 응답</text><text x="590" y="890" class="sub">사용자가 검색 조건을 직접 조정</text>
</svg>
