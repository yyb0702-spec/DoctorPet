<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
<title id="title">DoctorPet 병원 검색 공공데이터 AI 플로우</title><desc id="desc">공공데이터 적재, 직접 검색 캐시, AI 기반 안전 검색 흐름</desc>
<defs><style>.title{font:700 38px 'Malgun Gothic',sans-serif}.head{font:700 22px 'Malgun Gothic',sans-serif}.node{font:600 19px 'Malgun Gothic',sans-serif;text-anchor:middle}.sub{font:500 15px 'Malgun Gothic',sans-serif;text-anchor:middle}.label{font:600 15px 'Malgun Gothic',sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2.2}.line{fill:none;stroke:#000;stroke-width:2.6;marker-end:url(#arrow)}.sep{stroke:#000;stroke-width:1.5;stroke-dasharray:7 8}</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z"/></marker></defs>
<rect width="1800" height="1240" fill="#fff"/><text x="70" y="70" class="title">DoctorPet 병원 · 검색 · 공공데이터 · AI 플로우</text>
<text x="70" y="130" class="head">1. 공공데이터와 병원 운영 상태</text>
<rect x="80" y="180" width="290" height="78" rx="10" class="box"/><text x="225" y="214" class="node">전국 동물병원 공공데이터</text><text x="225" y="240" class="sub">초기 적재·주기 갱신</text><path d="M370 219H450" class="line"/><rect x="450" y="180" width="310" height="78" rx="10" class="box"/><text x="605" y="214" class="node">정규화·WGS84 좌표 변환</text><text x="605" y="240" class="sub">유효 데이터만 반영</text><path d="M760 219H840" class="line"/><rect x="840" y="180" width="300" height="78" rx="10" class="box"/><text x="990" y="214" class="node">병원·상세·역량 Upsert</text><text x="990" y="240" class="sub">제휴 정보 보강</text><path d="M1140 219H1220" class="line"/><rect x="1220" y="180" width="380" height="78" rx="10" class="box"/><text x="1410" y="214" class="node">영업·휴업·폐업 상태 반영</text><text x="1410" y="240" class="sub">예약 가능 여부의 서버 기준</text>
<path d="M70 320H1730" class="sep"/><text x="70" y="372" class="head">2. 직접 검색</text>
<rect x="80" y="430" width="250" height="78" rx="10" class="box"/><text x="205" y="477" class="node">검색 조건 입력</text><path d="M330 469H410" class="line"/><polygon points="540,406 670,469 540,532 410,469" class="box"/><text x="540" y="475" class="node">기본 첫 페이지?</text><path d="M670 469H750" class="line"/><text x="695" y="448" class="label">예</text><rect x="750" y="430" width="290" height="78" rx="10" class="box"/><text x="895" y="477" class="node">Redis 검색 캐시 조회</text><path d="M1040 469H1120" class="line"/><polygon points="1250,406 1380,469 1250,532 1120,469" class="box"/><text x="1250" y="475" class="node">캐시 HIT?</text><path d="M1380 469H1460" class="line"/><text x="1400" y="448" class="label">예</text><rect x="1460" y="430" width="250" height="78" rx="10" class="box"/><text x="1585" y="477" class="node">목록 응답</text>
<path d="M540 532V610H720" class="line"/><text x="560" y="588" class="label">아니오</text><path d="M1250 532V610H1080" class="line"/><text x="1272" y="588" class="label">아니오</text><rect x="720" y="620" width="360" height="78" rx="10" class="box"/><text x="900" y="654" class="node">QueryDSL 조건 검색</text><text x="900" y="680" class="sub">거리·영업·역량 조건 적용</text><path d="M1080 659H1160" class="line"/><rect x="1160" y="620" width="280" height="78" rx="10" class="box"/><text x="1300" y="654" class="node">캐시 저장</text><text x="1300" y="680" class="sub">첫 페이지에만 저장</text><path d="M1440 659H1585V508" class="line"/>
<path d="M70 720H1730" class="sep"/><text x="70" y="792" class="head">3. AI 상담 기반 검색</text>
<rect x="80" y="870" width="270" height="78" rx="10" class="box"/><text x="215" y="917" class="node">증상·선택 위치 입력</text><path d="M350 909H430" class="line"/><rect x="430" y="870" width="300" height="78" rx="10" class="box"/><text x="580" y="904" class="node">개인정보 패턴 마스킹</text><text x="580" y="930" class="sub">입력 길이·요청 횟수 제한</text><path d="M730 909H810" class="line"/><rect x="810" y="870" width="270" height="78" rx="10" class="box"/><text x="945" y="904" class="node">AI Gateway</text><text x="945" y="930" class="sub">진단·처방 문구 생성 금지</text><path d="M1080 909H1160" class="line"/><rect x="1160" y="870" width="320" height="78" rx="10" class="box"/><text x="1320" y="904" class="node">제한된 검색 Tool 호출</text><text x="1320" y="930" class="sub">역량·거리·영업 조건만 변환</text><path d="M1480 909H1560" class="line"/><polygon points="1660,846 1760,909 1660,972 1560,909" class="box"/><text x="1660" y="915" class="node">Tool 성공?</text>
<path d="M1660 972V1040H1450" class="line"/><text x="1682" y="1015" class="label">아니오</text><rect x="1160" y="1050" width="290" height="78" rx="10" class="box"/><text x="1305" y="1084" class="node">fallback=true 응답</text><text x="1305" y="1110" class="sub">서버 고정 안내·직접 검색 유도</text>
<path d="M1660 846V790H1360" class="line"/><text x="1682" y="820" class="label">예</text><rect x="1040" y="750" width="320" height="78" rx="10" class="box"/><text x="1200" y="784" class="node">검색 서비스 재사용</text><text x="1200" y="810" class="sub">구조화 조건 → QueryDSL</text><path d="M1040 789H960" class="line"/><rect x="640" y="750" width="320" height="78" rx="10" class="box"/><text x="800" y="784" class="node">AI 검색 결과 응답</text><text x="800" y="810" class="sub">병원 목록·안전 안내</text>
</svg>
