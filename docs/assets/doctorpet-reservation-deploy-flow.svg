<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
<title id="title">DoctorPet 예약 배포 플로우</title><desc id="desc">승인형 예약과 대기열, 진료 상태, 배포 운영 흐름</desc>
<defs><style>.title{font:700 38px 'Malgun Gothic',sans-serif}.head{font:700 22px 'Malgun Gothic',sans-serif}.node{font:600 19px 'Malgun Gothic',sans-serif;text-anchor:middle}.sub{font:500 15px 'Malgun Gothic',sans-serif;text-anchor:middle}.label{font:600 15px 'Malgun Gothic',sans-serif}.box{fill:#fff;stroke:#000;stroke-width:2.2}.line{fill:none;stroke:#000;stroke-width:2.6;marker-end:url(#arrow)}.sep{stroke:#000;stroke-width:1.5;stroke-dasharray:7 8}</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z"/></marker></defs>
<rect width="1800" height="1420" fill="#fff"/><text x="70" y="70" class="title">DoctorPet 예약 · 대기열 · 배포 플로우</text>
<text x="70" y="130" class="head">1. 승인형 예약</text>
<rect x="80" y="180" width="230" height="78" rx="10" class="box"/><text x="195" y="227" class="node">30분 슬롯 조회</text><path d="M310 219H390" class="line"/><polygon points="520,156 650,219 520,282 390,219" class="box"/><text x="520" y="225" class="node">슬롯 상태</text><path d="M650 219H730" class="line"/><text x="670" y="198" class="label">OPEN</text><rect x="730" y="180" width="310" height="78" rx="10" class="box"/><text x="885" y="214" class="node">REQUESTED 예약 생성</text><text x="885" y="240" class="sub">슬롯 RESERVED</text><path d="M1040 219H1120" class="line"/><polygon points="1250,156 1380,219 1250,282 1120,219" class="box"/><text x="1250" y="225" class="node">병원 승인 판단</text><path d="M1380 219H1460" class="line"/><text x="1400" y="198" class="label">승인</text><rect x="1460" y="180" width="240" height="78" rx="10" class="box"/><text x="1580" y="227" class="node">CONFIRMED</text>
<path d="M1250 282V355" class="line"/><text x="1272" y="330" class="label">거절·타임아웃</text><rect x="1070" y="370" width="360" height="78" rx="10" class="box"/><text x="1250" y="404" class="node">REJECTED</text><text x="1250" y="430" class="sub">슬롯 반환·대기열 승급 판단</text><path d="M520 282V355" class="line"/><text x="542" y="330" class="label">RESERVED</text><rect x="340" y="370" width="360" height="78" rx="10" class="box"/><text x="520" y="404" class="node">WAITING 등록</text><text x="520" y="430" class="sub">예약 4시간 전까지만</text>
<path d="M1070 409H1060" class="line"/><path d="M700 409H900" class="line"/><polygon points="980,346 1060,409 980,472 900,409" class="box"/><text x="980" y="415" class="node">FIFO 대기자?</text><path d="M980 472V545" class="line"/><text x="1002" y="520" class="label">있음·4시간 전</text><rect x="800" y="560" width="360" height="78" rx="10" class="box"/><text x="980" y="594" class="node">OFFERED: 10분 이하 임시 홀드</text><text x="980" y="620" class="sub">수락 시 신규 REQUESTED 생성</text><path d="M900 409H760V585H680" class="line"/><text x="715" y="570" class="label">없음·4시간 이내</text><rect x="340" y="560" width="340" height="78" rx="10" class="box"/><text x="510" y="594" class="node">WAITING 시스템 CANCELED</text><text x="510" y="620" class="sub">슬롯 OPEN</text>
<path d="M70 700H1730" class="sep"/><text x="70" y="752" class="head">2. 진료 상태와 운영 스케줄러</text><rect x="100" y="800" width="230" height="76" rx="10" class="box"/><text x="215" y="846" class="node">CONFIRMED</text><path d="M330 838H410" class="line"/><rect x="410" y="800" width="230" height="76" rx="10" class="box"/><text x="525" y="846" class="node">CHECKED_IN</text><path d="M640 838H720" class="line"/><rect x="720" y="800" width="270" height="76" rx="10" class="box"/><text x="855" y="846" class="node">IN_TREATMENT</text><path d="M990 838H1070" class="line"/><rect x="1070" y="800" width="350" height="76" rx="10" class="box"/><text x="1245" y="846" class="node">TREATMENT_COMPLETED</text>
<rect x="100" y="940" width="350" height="78" rx="10" class="box"/><text x="275" y="974" class="node">승인 타임아웃 스케줄러</text><text x="275" y="1000" class="sub">REQUESTED 자동 거절</text><path d="M450 979H540" class="line"/><rect x="540" y="940" width="350" height="78" rx="10" class="box"/><text x="715" y="974" class="node">대기열 만료 스케줄러</text><text x="715" y="1000" class="sub">OFFERED 만료 후 다음 FIFO</text><path d="M890 979H980" class="line"/><rect x="980" y="940" width="300" height="78" rx="10" class="box"/><text x="1130" y="974" class="node">노쇼 스케줄러</text><text x="1130" y="1000" class="sub">유예 후 NO_SHOW</text>
<path d="M70 1080H1730" class="sep"/><text x="70" y="1132" class="head">3. 배포 운영 흐름</text><rect x="100" y="1180" width="240" height="78" rx="10" class="box"/><text x="220" y="1227" class="node">develop 병합</text><path d="M340 1219H420" class="line"/><rect x="420" y="1180" width="250" height="78" rx="10" class="box"/><text x="545" y="1227" class="node">CI Build·Test</text><path d="M670 1219H750" class="line"/><rect x="750" y="1180" width="280" height="78" rx="10" class="box"/><text x="890" y="1227" class="node">Docker 이미지 빌드</text><path d="M1030 1219H1110" class="line"/><rect x="1110" y="1180" width="280" height="78" rx="10" class="box"/><text x="1250" y="1227" class="node">EC2 compose 배포</text><path d="M1390 1219H1470" class="line"/><rect x="1470" y="1180" width="220" height="78" rx="10" class="box"/><text x="1580" y="1227" class="node">Health 확인</text>
