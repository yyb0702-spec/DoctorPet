<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1620" viewBox="0 0 1800 1620" role="img" aria-labelledby="title desc">
  <title id="title">DoctorPet 예약 대기열 포함 비즈니스 플로우</title>
  <desc id="desc">보호자의 병원 검색, 예약 요청과 대기열 자동 승급, 진료와 결제, 병원 휴폐업 처리 흐름</desc>
  <defs>
    <style>
      .hd{font:700 34px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#122033}.n{font:600 18px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#182536;text-anchor:middle}.sm{font:500 15px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#40556b;text-anchor:middle}.edge{stroke:#546a80;stroke-width:3;fill:none;marker-end:url(#arrow)}.lbl{font:600 15px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#364a60}.node{stroke-width:2}.normal{fill:#e7f0ff;stroke:#3574d3}.wait{fill:#fff3cd;stroke:#c98900}.ok{fill:#ddf7e6;stroke:#249452}.warn{fill:#fde8e8;stroke:#cf4747}.care{fill:#e4f8fa;stroke:#1491a0}.pay{fill:#f2e9ff;stroke:#8152c8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#546a80"/></marker>
  </defs>
  <rect width="1800" height="1620" fill="#fbfdff"/>
  <text x="80" y="70" class="hd">DoctorPet 예약 · 대기열 · 진료 · 결제 비즈니스 플로우</text>

  <!-- Search and request -->
  <rect x="690" y="105" width="420" height="78" rx="14" class="node normal"/><text x="900" y="153" class="n">보호자: 병원 검색·상세 조회</text>
  <path d="M900 183V230" class="edge"/>
  <rect x="690" y="240" width="420" height="78" rx="14" class="node normal"/><text x="900" y="288" class="n">예약 슬롯 선택</text>
  <path d="M900 318V367" class="edge"/>
  <polygon points="900,375 1040,450 900,525 760,450" class="node pay"/><text x="900" y="456" class="n">슬롯 상태</text>
  <path d="M1040 450H1225" class="edge"/><text x="1115" y="434" class="lbl">OPEN</text>
  <rect x="1235" y="410" width="440" height="82" rx="14" class="node normal"/><text x="1455" y="444" class="n">예약 요청 생성: REQUESTED</text><text x="1455" y="470" class="sm">슬롯 RESERVED</text>
  <path d="M760 450H575" class="edge"/><text x="645" y="434" class="lbl">RESERVED</text>
  <rect x="125" y="405" width="440" height="92" rx="14" class="node wait"/><text x="345" y="440" class="n">대기열 등록: WAITING</text><text x="345" y="469" class="sm">예약 4시간 전까지만</text>

  <!-- approval -->
  <path d="M1455 492V555" class="edge"/>
  <polygon points="1455,565 1605,640 1455,715 1305,640" class="node pay"/><text x="1455" y="646" class="n">병원 승인 판단</text>
  <path d="M1305 640H1115" class="edge"/><text x="1185" y="624" class="lbl">거절·승인 타임아웃</text>
  <rect x="675" y="598" width="430" height="85" rx="14" class="node warn"/><text x="890" y="633" class="n">REJECTED</text><text x="890" y="660" class="sm">슬롯 반환</text>
  <path d="M1605 640H1680" class="edge"/><text x="1625" y="624" class="lbl">승인</text>
  <rect x="1250" y="760" width="420" height="92" rx="14" class="node ok"/><text x="1460" y="795" class="n">CONFIRMED</text><text x="1460" y="823" class="sm">보호자 알림 저장 → 커밋 후 SSE</text>
  <path d="M1680 640V750H1460" class="edge"/>

  <!-- waitlist release and offer -->
  <path d="M345 497V575H600" class="edge"/>
  <path d="M890 683V725H600" class="edge"/>
  <polygon points="600,720 765,795 600,870 435,795" class="node pay"/><text x="600" y="801" class="n">활성 대기열 존재?</text>
  <path d="M435 795H215" class="edge"/><text x="305" y="778" class="lbl">없음</text>
  <rect x="70" y="755" width="140" height="80" rx="14" class="node normal"/><text x="140" y="803" class="n">슬롯 OPEN</text>
  <path d="M600 870V930" class="edge"/><text x="614" y="904" class="lbl">4시간 이내</text>
  <rect x="360" y="940" width="480" height="92" rx="14" class="node warn"/><text x="600" y="975" class="n">WAITING 시스템 CANCELED</text><text x="600" y="1003" class="sm">슬롯 OPEN</text>
  <path d="M765 795H940" class="edge"/><text x="795" y="778" class="lbl">FIFO WAITING 존재·4시간 전</text>
  <rect x="950" y="750" width="420" height="92" rx="14" class="node wait"/><text x="1160" y="785" class="n">OFFERED 전이</text><text x="1160" y="813" class="sm">10분 이하 제안 + 알림 저장</text>
  <path d="M1160 842V900" class="edge"/>
  <polygon points="1160,910 1310,985 1160,1060 1010,985" class="node pay"/><text x="1160" y="991" class="n">보호자 응답</text>
  <path d="M1010 985H900V795H765" class="edge"/><text x="930" y="969" class="lbl">거절·만료</text>
  <path d="M1310 985H1455V492" class="edge"/><text x="1330" y="969" class="lbl">수락</text>

  <!-- treatment -->
  <path d="M1460 852V920" class="edge"/>
  <polygon points="1460,930 1600,1005 1460,1080 1320,1005" class="node pay"/><text x="1460" y="1011" class="n">진료 진행</text>
  <path d="M1460 1080V1120" class="edge"/>
  <rect x="1340" y="1130" width="240" height="72" rx="14" class="node care"/><text x="1460" y="1175" class="n">CHECKED_IN</text>
  <path d="M1460 1202V1230" class="edge"/>
  <rect x="1340" y="1240" width="240" height="72" rx="14" class="node care"/><text x="1460" y="1285" class="n">IN_TREATMENT</text>
  <path d="M1460 1312V1340" class="edge"/>
  <rect x="1310" y="1350" width="300" height="72" rx="14" class="node care"/><text x="1460" y="1395" class="n">TREATMENT_COMPLETED</text>

  <!-- payment -->
  <path d="M1310 1386H1065" class="edge"/>
  <rect x="680" y="1350" width="375" height="72" rx="14" class="node pay"/><text x="868" y="1381" class="n">병원: 청구 항목 초안 작성·수정</text><text x="868" y="1405" class="sm">진료 완료 후, 선기록 전까지만</text>
  <path d="M680 1386H550" class="edge"/>
  <rect x="185" y="1350" width="355" height="72" rx="14" class="node pay"/><text x="363" y="1381" class="n">항목 합계로 PENDING 결제 선기록</text>
  <path d="M363 1422V1470" class="edge"/>
  <polygon points="363,1480 503,1545 363,1610 223,1545" class="node pay"/><text x="363" y="1551" class="n">자동 결제 결과</text>
  <path d="M503 1545H675" class="edge"/><text x="565" y="1528" class="lbl">성공</text>
  <rect x="685" y="1508" width="350" height="82" rx="14" class="node ok"/><text x="860" y="1541" class="n">PAID</text><text x="860" y="1568" class="sm">JSON 영수증 조회 가능</text>
  <path d="M223 1545H80" class="edge"/><text x="125" y="1528" class="lbl">실패</text>
  <rect x="20" y="1472" width="190" height="145" rx="14" class="node warn"/><text x="115" y="1515" class="n">OFFLINE_REQUIRED</text><text x="115" y="1542" class="sm">보호자 결제수단 변경 후</text><text x="115" y="1567" class="sm">명시적 재청구</text>

  <!-- notification/chat -->
  <path d="M1250 805H1070" class="edge"/>
  <rect x="840" y="865" width="230" height="92" rx="14" class="node care"/><text x="955" y="900" class="n">예약 단위 채팅</text><text x="955" y="928" class="sm">STOMP 메시지 저장 후 전달</text>
  <path d="M1250 815H1110V1060" class="edge"/>
  <rect x="840" y="1070" width="330" height="92" rx="14" class="node care"/><text x="1005" y="1105" class="n">예약 알림</text><text x="1005" y="1133" class="sm">보호자 + 병원 스태프 SSE fan-out</text>

  <!-- hospital closure exception -->
  <rect x="70" y="1080" width="440" height="70" rx="14" class="node warn"/><text x="290" y="1124" class="n">병원 휴업·폐업</text>
  <path d="M510 1115H620" class="edge"/>
  <rect x="630" y="1080" width="360" height="70" rx="14" class="node warn"/><text x="810" y="1124" class="n">CONFIRMED 예약: HOSPITAL_CANCELED</text>
  <path d="M810 1150V1210" class="edge"/>
  <rect x="570" y="1220" width="480" height="75" rx="14" class="node warn"/><text x="810" y="1250" class="n">활성 WAITING·OFFERED도 시스템 CANCELED</text><text x="810" y="1276" class="sm">슬롯 OPEN</text>
</svg>
