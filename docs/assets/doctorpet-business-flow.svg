<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">DoctorPet 통합 비즈니스 로직 플로우</title>
  <desc id="desc">병원 검색부터 예약, 대기열 자동 승급, 진료, 결제, 알림과 병원 휴폐업 예외 처리까지의 흐름</desc>
  <defs>
    <style>
      .title{font:700 34px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#122033}.sub{font:500 17px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#536174}.h{font:700 19px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#fff}.t{font:600 16px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#16263a}.s{font:500 13px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#536174}.arrow{stroke:#6b7c93;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#6b7c93"/></marker>
  </defs>
  <rect width="1600" height="1080" fill="#f7fafc"/>
  <text x="70" y="64" class="title">DoctorPet 통합 비즈니스 로직 플로우</text>
  <text x="70" y="94" class="sub">검색 · 승인형 예약 · 대기열 자동 승급 · 진료 · 결제 · 실시간 알림</text>

  <rect x="70" y="132" width="320" height="54" rx="12" fill="#2563eb"/><text x="94" y="166" class="h">1. 병원 탐색과 예약 요청</text>
  <rect x="420" y="132" width="520" height="54" rx="12" fill="#7c3aed"/><text x="444" y="166" class="h">2. 승인형 예약과 대기열 자동 승급</text>
  <rect x="970" y="132" width="560" height="54" rx="12" fill="#0891b2"/><text x="994" y="166" class="h">3. 진료 · 결제 · 커뮤니케이션</text>

  <rect x="70" y="220" width="320" height="95" rx="14" fill="#e0ecff" stroke="#2563eb"/><text x="94" y="257" class="t">증상·위치 기반 병원 검색</text><text x="94" y="284" class="s">병원 정보 · 후기 · 진료 가능 여부</text>
  <path d="M230 315V350" class="arrow"/>
  <rect x="70" y="360" width="320" height="95" rx="14" fill="#e0ecff" stroke="#2563eb"/><text x="94" y="397" class="t">시간 슬롯 선택</text><text x="94" y="424" class="s">OPEN / RESERVED 상태 확인</text>
  <path d="M390 407H420" class="arrow"/>

  <polygon points="500,350 610,407 500,464 390,407" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="450" y="403" class="t">슬롯이</text><text x="449" y="425" class="t">OPEN인가?</text>
  <path d="M610 407H650" class="arrow"/><text x="620" y="393" class="s">예</text>
  <rect x="650" y="360" width="250" height="95" rx="14" fill="#f3e8ff" stroke="#7c3aed"/><text x="675" y="397" class="t">REQUESTED 예약 생성</text><text x="675" y="424" class="s">보호자 요청 → 병원 검토</text>
  <path d="M500 464V510" class="arrow"/><text x="515" y="491" class="s">아니오</text>
  <rect x="420" y="520" width="250" height="105" rx="14" fill="#fef3c7" stroke="#d97706"/><text x="445" y="558" class="t">WAITING 대기열 등록</text><text x="445" y="584" class="s">동일 회원·슬롯 중복 차단</text><text x="445" y="605" class="s">예약 4시간 전까지만</text>
  <path d="M670 572H720" class="arrow"/>
  <rect x="720" y="520" width="220" height="105" rx="14" fill="#fef3c7" stroke="#d97706"/><text x="746" y="558" class="t">FIFO OFFERED</text><text x="746" y="584" class="s">10분 임시 홀드</text><text x="746" y="605" class="s">슬롯은 RESERVED 유지</text>
  <path d="M830 455V520" class="dash"/>
  <path d="M830 625V675" class="arrow"/>
  <rect x="720" y="685" width="220" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text x="747" y="722" class="t">수락 가능?</text><text x="747" y="749" class="s">OFFERED · 만료 전</text>
  <path d="M720 730H670" class="arrow"/><text x="683" y="715" class="s">아니오</text>
  <path d="M940 730H995" class="arrow"/><text x="955" y="715" class="s">예</text>
  <rect x="420" y="685" width="250" height="90" rx="14" fill="#fff7ed" stroke="#d97706"/><text x="445" y="722" class="t">거절·만료</text><text x="445" y="749" class="s">다음 FIFO 승급, 없으면 OPEN</text>
  <rect x="995" y="685" width="250" height="90" rx="14" fill="#f3e8ff" stroke="#7c3aed"/><text x="1020" y="722" class="t">새 REQUESTED 생성</text><text x="1020" y="749" class="s">기존 승인·거절 흐름 연결</text>
  <path d="M900 407H970" class="arrow"/>
  <path d="M1120 455V520" class="arrow"/>

  <rect x="970" y="360" width="260" height="95" rx="14" fill="#cffafe" stroke="#0891b2"/><text x="995" y="397" class="t">병원 승인 / 거절</text><text x="995" y="424" class="s">CONFIRMED 또는 REJECTED</text>
  <rect x="970" y="520" width="260" height="95" rx="14" fill="#cffafe" stroke="#0891b2"/><text x="995" y="558" class="t">CHECKED_IN → IN_PROGRESS</text><text x="995" y="585" class="s">진료 시작 및 예약당 채팅</text>
  <path d="M1230 567H1280" class="arrow"/>
  <rect x="1280" y="520" width="250" height="95" rx="14" fill="#cffafe" stroke="#0891b2"/><text x="1305" y="558" class="t">TREATMENT_COMPLETED</text><text x="1305" y="585" class="s">진료 완료</text>
  <path d="M1405 615V675" class="arrow"/>
  <rect x="1280" y="685" width="250" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="1305" y="722" class="t">청구 항목 작성·선기록</text><text x="1305" y="749" class="s">PENDING 결제 생성</text>
  <path d="M1405 775V825" class="arrow"/>
  <rect x="1280" y="835" width="250" height="95" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="1305" y="872" class="t">자동 결제 결과</text><text x="1305" y="898" class="s">PAID · OFFLINE_REQUIRED</text><text x="1305" y="919" class="s">JSON 영수증 · 실패 셀프 복구</text>

  <rect x="970" y="970" width="560" height="62" rx="14" fill="#fee2e2" stroke="#dc2626"/><text x="995" y="996" class="t">예외: 병원 휴·폐업</text><text x="995" y="1019" class="s">CONFIRMED → HOSPITAL_CANCELED · WAITING/OFFERED 시스템 취소 · 슬롯 OPEN</text>
  <path d="M1100 930V970" class="dash"/>

  <rect x="70" y="835" width="1100" height="95" rx="14" fill="#e2e8f0" stroke="#64748b"/><text x="95" y="870" class="t">알림과 데이터 정합성</text><text x="95" y="898" class="s">상태 변경과 알림 저장은 트랜잭션으로 보장 · 커밋 후 SSE 전달(보호자 및 병원 스태프) · 채팅 메시지도 저장 커밋 후 STOMP 전달</text>
  <path d="M1120 625V835" class="dash"/>
  <path d="M830 775V835" class="dash"/>
</svg>
