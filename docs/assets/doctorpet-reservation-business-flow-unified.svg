<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2140" viewBox="0 0 1800 2140" role="img" aria-labelledby="title desc">
  <title id="title">DoctorPet 통합 비즈니스 로직 플로우</title>
  <desc id="desc">병원 검색부터 예약 요청, 대기열 자동 승급, 진료, 결제와 병원 휴폐업 예외 처리를 하나로 연결한 흑백 흐름도</desc>
  <defs>
    <style>
      .title{font:700 38px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.note{font:500 16px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.text{font:600 20px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.sub{font:500 16px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.label{font:600 16px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2.3}.decision{fill:#fff;stroke:#000;stroke-width:2.3}.edge{stroke:#000;stroke-width:2.7;fill:none;marker-end:url(#arrow)}.dash{stroke:#000;stroke-width:2.2;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}.divider{stroke:#000;stroke-width:1.5;stroke-dasharray:5 8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#000"/></marker>
  </defs>
  <rect width="1800" height="2140" fill="#fff"/>
  <text x="80" y="72" class="title">DoctorPet 통합 비즈니스 로직 플로우</text>
  <text x="80" y="105" class="note">실선: 상태 전이 · 점선: 재진입 또는 커밋 후 전달 · 화살표는 전용 여백으로만 연결</text>

  <!-- 예약 요청 -->
  <rect x="100" y="180" width="250" height="82" rx="10" class="box"/><text x="225" y="230" class="text">보호자: 병원 검색·상세 조회</text>
  <path d="M350 221H400" class="edge"/>
  <rect x="400" y="180" width="220" height="82" rx="10" class="box"/><text x="510" y="230" class="text">예약 슬롯 선택</text>
  <path d="M620 221H680" class="edge"/>
  <polygon points="800,150 920,221 800,292 680,221" class="decision"/><text x="800" y="227" class="text">슬롯 상태</text>
  <path d="M920 221H970" class="edge"/><text x="935" y="202" class="label">OPEN</text>
  <rect x="970" y="180" width="320" height="82" rx="10" class="box"/><text x="1130" y="214" class="text">예약 요청 생성: REQUESTED</text><text x="1130" y="242" class="sub">슬롯 RESERVED</text>
  <path d="M1130 262V330" class="edge"/>
  <polygon points="1130,338 1260,408 1130,478 1000,408" class="decision"/><text x="1130" y="414" class="text">병원 승인 판단</text>
  <path d="M1130 478V535" class="edge"/><text x="1148" y="514" class="label">승인</text>
  <rect x="970" y="545" width="320" height="82" rx="10" class="box"/><text x="1130" y="580" class="text">CONFIRMED</text><text x="1130" y="608" class="sub">보호자 알림 저장 → 커밋 후 SSE</text>
  <path d="M1260 408H1350" class="edge"/><text x="1276" y="389" class="label">거절·승인 타임아웃</text>
  <rect x="1360" y="368" width="250" height="80" rx="10" class="box"/><text x="1485" y="402" class="text">REJECTED</text><text x="1485" y="430" class="sub">슬롯 반환</text>

  <!-- 대기열 등록과 슬롯 반환 -->
  <path d="M800 292V365H640V420" class="edge"/><text x="818" y="332" class="label">RESERVED</text>
  <rect x="455" y="430" width="370" height="86" rx="10" class="box"/><text x="640" y="465" class="text">대기열 등록: WAITING</text><text x="640" y="493" class="sub">예약 4시간 전까지만</text>
  <path d="M640 516V700H750" class="dash"/><text x="655" y="680" class="note">슬롯 반환 전까지 WAITING 유지</text>
  <path d="M1485 448H1760V760H950V700" class="edge"/>
  <rect x="750" y="660" width="200" height="80" rx="10" class="box"/><text x="850" y="708" class="text">슬롯 반환 트리거</text>
  <path d="M850 740V790" class="edge"/>
  <polygon points="850,798 990,868 850,938 710,868" class="decision"/><text x="850" y="874" class="text">활성 대기열 존재?</text>
  <path d="M710 868H590" class="edge"/><text x="620" y="848" class="label">없음</text>
  <rect x="350" y="828" width="240" height="80" rx="10" class="box"/><text x="470" y="877" class="text">슬롯 OPEN</text>
  <path d="M850 938V990" class="edge"/><text x="868" y="972" class="label">4시간 이내</text>
  <rect x="650" y="1000" width="400" height="88" rx="10" class="box"/><text x="850" y="1035" class="text">WAITING 시스템 CANCELED</text><text x="850" y="1063" class="sub">슬롯 OPEN</text>
  <path d="M990 868H1060" class="edge"/><text x="1005" y="848" class="label">FIFO 대기자·4시간 전</text>
  <rect x="1070" y="828" width="300" height="80" rx="10" class="box"/><text x="1220" y="862" class="text">OFFERED 전이</text><text x="1220" y="890" class="sub">10분 이하 제안 + 알림 저장</text>
  <path d="M1220 908V970" class="edge"/>
  <polygon points="1220,978 1350,1048 1220,1118 1090,1048" class="decision"/><text x="1220" y="1054" class="text">보호자 응답</text>
  <path d="M1350 1048H1450V770H850V798" class="edge"/><text x="1365" y="1028" class="label">거절·만료</text>
  <path d="M1220 1118V1170" class="edge"/><text x="1238" y="1152" class="label">수락</text>
  <rect x="1020" y="1180" width="400" height="84" rx="10" class="box"/><text x="1220" y="1215" class="text">신규 REQUESTED 생성</text><text x="1220" y="1243" class="sub">기존 병원 승인·거절 흐름 재진입</text>
  <path d="M1420 1222H1760V130H1130V180" class="dash"/>

  <!-- CONFIRMED의 커밋 후 전달 -->
  <path d="M1290 577H1320" class="dash"/>
  <rect x="1330" y="535" width="310" height="66" rx="10" class="box"/><text x="1485" y="562" class="text">예약 알림</text><text x="1485" y="586" class="sub">보호자 + 병원 스태프 SSE fan-out</text>
  <path d="M1290 605V675H1330" class="dash"/>
  <rect x="1330" y="642" width="310" height="66" rx="10" class="box"/><text x="1485" y="669" class="text">예약 단위 채팅</text><text x="1485" y="693" class="sub">STOMP 메시지 저장 후 전달</text>

  <!-- 진료와 결제 -->
  <path d="M1130 627H1760V1290H900V1320" class="edge"/>
  <rect x="780" y="1330" width="240" height="72" rx="10" class="box"/><text x="900" y="1375" class="text">CHECKED_IN</text>
  <path d="M1020 1366H1080" class="edge"/>
  <rect x="1090" y="1330" width="240" height="72" rx="10" class="box"/><text x="1210" y="1375" class="text">IN_TREATMENT</text>
  <path d="M1330 1366H1380" class="edge"/>
  <rect x="1390" y="1330" width="250" height="72" rx="10" class="box"/><text x="1515" y="1375" class="text">TREATMENT_COMPLETED</text>
  <path d="M1515 1402V1460" class="edge"/>
  <rect x="1280" y="1470" width="450" height="84" rx="10" class="box"/><text x="1505" y="1504" class="text">병원: 청구 항목 초안 작성·수정</text><text x="1505" y="1532" class="sub">진료 완료 후, 결제 선기록 전까지만</text>
  <path d="M1505 1554V1610" class="edge"/>
  <rect x="1280" y="1620" width="450" height="72" rx="10" class="box"/><text x="1505" y="1665" class="text">항목 합계로 PENDING 결제 선기록</text>
  <path d="M1505 1692V1740" class="edge"/>
  <polygon points="1505,1748 1640,1813 1505,1878 1370,1813" class="decision"/><text x="1505" y="1819" class="text">자동 결제 결과</text>
  <path d="M1370 1813H1260" class="edge"/><text x="1280" y="1793" class="label">실패</text>
  <rect x="850" y="1770" width="400" height="86" rx="10" class="box"/><text x="1050" y="1804" class="text">OFFLINE_REQUIRED</text><text x="1050" y="1832" class="sub">결제수단 변경 후 명시적 재청구</text>
  <path d="M1640 1813H1660V1933H1640" class="edge"/><text x="1650" y="1793" class="label">성공</text>
  <rect x="1350" y="1890" width="290" height="86" rx="10" class="box"/><text x="1495" y="1924" class="text">PAID</text><text x="1495" y="1952" class="sub">JSON 영수증 조회 가능</text>

  <!-- 휴폐업 예외 -->
  <path d="M80 2025H1720" class="divider"/>
  <text x="80" y="2062" class="note">예외: 병원 휴업·폐업</text>
  <rect x="160" y="2080" width="250" height="76" rx="10" class="box"/><text x="285" y="2127" class="text">병원 휴업·폐업</text>
  <path d="M410 2118H490" class="edge"/>
  <rect x="500" y="2080" width="375" height="76" rx="10" class="box"/><text x="687" y="2127" class="text">CONFIRMED: HOSPITAL_CANCELED</text>
  <path d="M875 2118H960" class="edge"/>
  <rect x="970" y="2080" width="570" height="76" rx="10" class="box"/><text x="1255" y="2110" class="text">활성 WAITING·OFFERED 시스템 CANCELED</text><text x="1255" y="2138" class="sub">슬롯 OPEN · 추가 승급 없음</text>
</svg>
