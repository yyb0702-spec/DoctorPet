<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2600" viewBox="0 0 1800 2600" role="img" aria-labelledby="title desc">
  <title id="title">DoctorPet 통합 비즈니스 로직 플로우</title>
  <desc id="desc">병원 검색부터 승인형 예약, 대기열 자동 승급, 진료와 결제, 휴폐업 예외까지 연결한 흑백 흐름도</desc>
  <defs>
    <style>
      .title{font:700 38px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.note{font:500 16px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.lane{font:700 21px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.text{font:600 20px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.sub{font:500 16px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.label{font:600 16px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2.3}.decision{fill:#fff;stroke:#000;stroke-width:2.3}.edge{stroke:#000;stroke-width:2.7;fill:none;marker-end:url(#arrow)}.dash{stroke:#000;stroke-width:2.2;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}.divider{stroke:#000;stroke-width:1.5;stroke-dasharray:5 8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#000"/></marker>
  </defs>
  <rect width="1800" height="2600" fill="#fff"/>
  <text x="80" y="68" class="title">DoctorPet 통합 비즈니스 로직 플로우</text>
  <text x="80" y="102" class="note">실선: 상태 전이 · 점선: 커밋 후 전달 또는 기존 흐름 재진입 · 모든 연결선은 노드 바깥 여백으로만 배치</text>

  <text x="80" y="156" class="lane">1. 예약 요청과 병원 승인</text>
  <rect x="100" y="190" width="300" height="82" rx="10" class="box"/><text x="250" y="240" class="text">보호자: 병원 검색·상세 조회</text>
  <path d="M400 231H425" class="edge"/>
  <rect x="425" y="190" width="220" height="82" rx="10" class="box"/><text x="535" y="240" class="text">예약 슬롯 선택</text>
  <path d="M645 231H700" class="edge"/>
  <polygon points="820,160 940,231 820,302 700,231" class="decision"/><text x="820" y="237" class="text">슬롯 상태</text>
  <path d="M940 231H995" class="edge"/><text x="954" y="208" class="label">OPEN</text>
  <rect x="995" y="190" width="320" height="82" rx="10" class="box"/><text x="1155" y="224" class="text">예약 요청 생성: REQUESTED</text><text x="1155" y="252" class="sub">슬롯 RESERVED</text>
  <path d="M1155 272V338" class="edge"/>
  <polygon points="1155,346 1285,416 1155,486 1025,416" class="decision"/><text x="1155" y="422" class="text">병원 승인 판단</text>
  <path d="M1155 486V545" class="edge"/><text x="1174" y="522" class="label">승인</text>
  <rect x="995" y="555" width="320" height="82" rx="10" class="box"/><text x="1155" y="590" class="text">CONFIRMED</text><text x="1155" y="618" class="sub">보호자 알림 저장 → 커밋 후 SSE</text>
  <path d="M1285 416H1390" class="edge"/><text x="1295" y="360" class="label">거절·타임아웃</text>
  <rect x="1400" y="376" width="260" height="80" rx="10" class="box"/><text x="1530" y="410" class="text">REJECTED</text><text x="1530" y="438" class="sub">슬롯 반환</text>
  <path d="M1315 595H1365" class="dash"/>
  <rect x="1375" y="555" width="320" height="82" rx="10" class="box"/><text x="1535" y="590" class="text">예약 단위 채팅</text><text x="1535" y="618" class="sub">메시지 저장 → 커밋 후 STOMP 전달</text>

  <text x="80" y="716" class="lane">2. 예약 대기열과 슬롯 반환</text>
  <path d="M820 302V390H600V770" class="edge"/><text x="838" y="342" class="label">RESERVED</text>
  <rect x="415" y="780" width="370" height="86" rx="10" class="box"/><text x="600" y="815" class="text">대기열 등록: WAITING</text><text x="600" y="843" class="sub">예약 4시간 전까지만</text>
  <path d="M1400 436H1355V850H1000" class="edge"/>
  <rect x="800" y="810" width="200" height="80" rx="10" class="box"/><text x="900" y="858" class="text">슬롯 반환 트리거</text>
  <path d="M900 890V950" class="edge"/>
  <polygon points="900,958 1040,1028 900,1098 760,1028" class="decision"/><text x="900" y="1034" class="text">활성 대기열 존재?</text>
  <path d="M760 1028H600" class="edge"/><text x="640" y="1006" class="label">없음</text>
  <rect x="350" y="988" width="250" height="80" rx="10" class="box"/><text x="475" y="1037" class="text">슬롯 OPEN</text>
  <path d="M900 1098V1160" class="edge"/><text x="918" y="1138" class="label">4시간 이내</text>
  <rect x="650" y="1170" width="500" height="88" rx="10" class="box"/><text x="900" y="1205" class="text">WAITING 시스템 CANCELED</text><text x="900" y="1233" class="sub">슬롯 OPEN · 추가 승급 없음</text>
  <path d="M1040 1028H1115" class="edge"/><text x="1050" y="970" class="label">FIFO·4시간 전</text>
  <rect x="1125" y="988" width="330" height="80" rx="10" class="box"/><text x="1290" y="1022" class="text">OFFERED 전이</text><text x="1290" y="1050" class="sub">10분 이하 제안 + 알림 저장</text>
  <path d="M1290 1068V1130" class="edge"/>
  <polygon points="1290,1138 1420,1208 1290,1278 1160,1208" class="decision"/><text x="1290" y="1214" class="text">보호자 응답</text>
  <path d="M1420 1208H1710V910H1040V850H1000" class="edge"/><text x="1440" y="1186" class="label">거절·만료</text>
  <path d="M1290 1278V1340" class="edge"/><text x="1308" y="1318" class="label">수락</text>
  <rect x="1090" y="1350" width="400" height="84" rx="10" class="box"/><text x="1290" y="1385" class="text">신규 REQUESTED 생성</text><text x="1290" y="1413" class="sub">기존 병원 승인·거절 흐름 재진입</text>
  <path d="M1490 1392H1740V125H1155V190" class="dash"/>

  <text x="80" y="1516" class="lane">3. 진료와 결제</text>
  <rect x="40" y="1380" width="220" height="72" rx="10" class="box"/><text x="150" y="1425" class="text">CONFIRMED</text>
  <path d="M260 1416H300" class="edge"/>
  <rect x="300" y="1380" width="280" height="72" rx="10" class="box"/><text x="440" y="1414" class="text">NO_SHOW_PENDING</text><text x="440" y="1440" class="sub">예약 +10분 · 유예 5분</text>
  <path d="M580 1416H620" class="edge"/><text x="586" y="1396" class="label">유예 경과</text>
  <rect x="620" y="1380" width="180" height="72" rx="10" class="box"/><text x="710" y="1425" class="text">NO_SHOW</text>
  <path d="M440 1452V1495H600V1535" class="edge"/><text x="455" y="1480" class="label">유예 중 도착 확인</text>
  <path d="M995 596H270V1495H600V1535" class="edge"/>
  <rect x="470" y="1535" width="260" height="72" rx="10" class="box"/><text x="600" y="1580" class="text">CHECKED_IN</text>
  <path d="M730 1571H790" class="edge"/>
  <rect x="800" y="1535" width="260" height="72" rx="10" class="box"/><text x="930" y="1580" class="text">IN_TREATMENT</text>
  <path d="M1060 1571H1120" class="edge"/>
  <rect x="1130" y="1535" width="300" height="72" rx="10" class="box"/><text x="1280" y="1580" class="text">TREATMENT_COMPLETED</text>
  <path d="M1280 1607V1665" class="edge"/>
  <rect x="1055" y="1675" width="450" height="84" rx="10" class="box"/><text x="1280" y="1709" class="text">병원: 청구 항목 초안 작성·수정</text><text x="1280" y="1737" class="sub">진료 완료 후, 결제 선기록 전까지만</text>
  <path d="M1280 1759V1815" class="edge"/>
  <rect x="1055" y="1825" width="450" height="72" rx="10" class="box"/><text x="1280" y="1870" class="text">항목 합계로 PENDING 결제 선기록</text>
  <path d="M1280 1897V1945" class="edge"/>
  <polygon points="1280,1953 1420,2023 1280,2093 1140,2023" class="decision"/><text x="1280" y="2029" class="text">자동 결제 결과</text>
  <path d="M1420 2023H1460" class="edge"/><text x="1428" y="2000" class="label">성공</text>
  <rect x="1470" y="1983" width="260" height="80" rx="10" class="box"/><text x="1600" y="2017" class="text">PAID</text><text x="1600" y="2045" class="sub">JSON 영수증 조회 가능</text>
  <path d="M1280 2093V2150H940" class="edge"/><text x="1298" y="2130" class="label">일시 실패·결과 미확정</text>
  <rect x="620" y="2110" width="320" height="84" rx="10" class="box"/><text x="780" y="2144" class="text">PENDING 유지</text><text x="780" y="2172" class="sub">단건 조회·제한 재시도</text>
  <path d="M620 2152H520" class="edge"/>
  <polygon points="390,2082 520,2152 390,2222 260,2152" class="decision"/><text x="390" y="2146" class="text">정산 결과</text><text x="390" y="2170" class="sub">확정 가능?</text>
  <path d="M390 2082H220V2300H1770V2023H1730" class="edge"/><text x="238" y="2062" class="label">PAID</text>
  <path d="M260 2152H180" class="edge"/><text x="188" y="2129" class="label">미확정</text>
  <rect x="40" y="2110" width="140" height="84" rx="10" class="box"/><text x="110" y="2144" class="text">PENDING</text><text x="110" y="2172" class="sub">운영 확인</text>
  <path d="M940 2152H1100V2190H1015V2200" class="edge"/><text x="945" y="2180" class="label">조회 결과 FAILED 확정</text>
  <rect x="850" y="2200" width="330" height="84" rx="10" class="box"/><text x="1015" y="2234" class="text">OFFLINE_REQUIRED</text><text x="1015" y="2262" class="sub">병원 현장 수납 또는 보호자 재청구</text>
  <path d="M850 2242H770" class="edge"/>
  <rect x="500" y="2200" width="260" height="84" rx="10" class="box"/><text x="630" y="2234" class="text">OFFLINE_PAID</text><text x="630" y="2262" class="sub">현장 수납 정산</text>
  <path d="M1600 2063V2120" class="edge"/><text x="1618" y="2094" class="label">전액 환불</text>
  <rect x="1470" y="2130" width="260" height="72" rx="10" class="box"/><text x="1600" y="2175" class="text">REFUNDED</text>
  <path d="M1015 2284V2330" class="edge"/>
  <rect x="780" y="2340" width="470" height="82" rx="10" class="box"/><text x="1015" y="2374" class="text">보호자: ACTIVE 결제수단 지정 후 재청구</text><text x="1015" y="2402" class="sub">새 PENDING 생성 · recovery_of 연결</text>
  <path d="M1600 2202V2295H1525V2340" class="edge"/>
  <rect x="1300" y="2340" width="450" height="82" rx="10" class="box"/><text x="1525" y="2374" class="text">병원: 정정 초안 후 재청구</text><text x="1525" y="2402" class="sub">새 PENDING 생성 · correction_of 연결</text>

  <path d="M80 2460H1720" class="divider"/>
  <text x="80" y="2497" class="lane">4. 예외: 병원 휴업·폐업</text>
  <rect x="470" y="2470" width="260" height="76" rx="10" class="box"/><text x="600" y="2517" class="text">병원 휴업·폐업</text>
  <path d="M730 2508H810" class="edge"/>
  <rect x="820" y="2470" width="360" height="76" rx="10" class="box"/><text x="1000" y="2517" class="text">CONFIRMED: HOSPITAL_CANCELED</text>
  <path d="M1180 2508H1260" class="edge"/>
  <rect x="1270" y="2470" width="450" height="76" rx="10" class="box"/><text x="1495" y="2499" class="text">활성 WAITING·OFFERED 시스템 CANCELED</text><text x="1495" y="2527" class="sub">슬롯 OPEN · 추가 승급 없음</text>
</svg>
