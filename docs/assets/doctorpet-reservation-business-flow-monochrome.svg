<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1780" viewBox="0 0 1900 1780" role="img" aria-labelledby="title desc">
  <title id="title">DoctorPet 예약 대기열 비즈니스 플로우</title>
  <desc id="desc">예약 요청, 대기열 자동 승급, 진료와 결제를 세 개의 독립 레인으로 나눈 흑백 흐름도</desc>
  <defs>
    <style>
      .title{font:700 34px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.lane{font:700 22px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.text{font:600 18px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.sub{font:500 15px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.label{font:600 15px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2}.decision{fill:#fff;stroke:#000;stroke-width:2}.edge{stroke:#000;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#000;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}.guide{stroke:#000;stroke-width:1.5;stroke-dasharray:5 7;fill:none}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#000"/></marker>
  </defs>
  <rect width="1900" height="1780" fill="#fff"/>
  <text x="80" y="70" class="title">DoctorPet 예약 · 대기열 · 진료 · 결제 비즈니스 플로우</text>
  <rect x="55" y="110" width="535" height="1320" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="680" y="110" width="535" height="1320" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="1305" y="110" width="535" height="1320" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="80" y="150" class="lane">예약 요청 · 병원 승인</text><text x="705" y="150" class="lane">대기열 자동 승급</text><text x="1330" y="150" class="lane">진료 · 결제</text>
  <path d="M80 170H565 M705 170H1190 M1330 170H1815" class="guide"/>

  <rect x="145" y="210" width="350" height="70" rx="8" class="box"/><text x="320" y="253" class="text">보호자: 병원 검색·상세 조회</text><path d="M320 280V320" class="edge"/>
  <rect x="145" y="330" width="350" height="70" rx="8" class="box"/><text x="320" y="373" class="text">예약 슬롯 선택</text><path d="M320 400V438" class="edge"/>
  <polygon points="320,445 455,515 320,585 185,515" class="decision"/><text x="320" y="521" class="text">슬롯 상태</text>
  <path d="M320 585V625" class="edge"/><text x="335" y="612" class="label">OPEN</text>
  <rect x="105" y="635" width="430" height="82" rx="8" class="box"/><text x="320" y="669" class="text">예약 요청 생성: REQUESTED</text><text x="320" y="696" class="sub">슬롯 RESERVED</text><path d="M320 717V760" class="edge"/>
  <polygon points="320,768 460,838 320,908 180,838" class="decision"/><text x="320" y="844" class="text">병원 승인 판단</text><path d="M320 908V950" class="edge"/><text x="336" y="934" class="label">승인</text>
  <rect x="105" y="960" width="430" height="88" rx="8" class="box"/><text x="320" y="994" class="text">CONFIRMED</text><text x="320" y="1021" class="sub">보호자 알림 저장 → 커밋 후 SSE</text>
  <path d="M180 838H95V1110H145" class="edge"/><text x="74" y="940" class="label">거절·승인 타임아웃</text><rect x="145" y="1120" width="350" height="78" rx="8" class="box"/><text x="320" y="1153" class="text">REJECTED</text><text x="320" y="1180" class="sub">슬롯 반환 이벤트</text>
  <path d="M455 515H770" class="edge"/><text x="525" y="498" class="label">RESERVED</text>
  <rect x="105" y="1260" width="430" height="64" rx="8" class="box"/><text x="320" y="1288" class="text">예약 단위 채팅</text><text x="320" y="1311" class="sub">STOMP 메시지 저장 후 전달</text>
  <rect x="105" y="1340" width="430" height="64" rx="8" class="box"/><text x="320" y="1368" class="text">예약 알림</text><text x="320" y="1391" class="sub">보호자 + 소속 병원 스태프 SSE fan-out</text>
  <path d="M535 1004H570V1292H535 M535 1018H555V1372H535" class="dashed"/>

  <rect x="770" y="455" width="355" height="86" rx="8" class="box"/><text x="948" y="489" class="text">대기열 등록: WAITING</text><text x="948" y="516" class="sub">예약 4시간 전까지만</text><path d="M948 541V640" class="dashed"/>
  <rect x="770" y="650" width="355" height="72" rx="8" class="box"/><text x="948" y="694" class="text">슬롯 반환 이벤트 수신</text><path d="M495 1159H635V686H770" class="edge"/><path d="M948 722V758" class="edge"/>
  <polygon points="948,765 1105,835 948,905 791,835" class="decision"/><text x="948" y="841" class="text">활성 대기열 존재?</text>
  <path d="M791 835H770" class="edge"/><text x="725" y="818" class="label">없음</text><rect x="690" y="795" width="80" height="80" rx="8" class="box"/><text x="730" y="843" class="text">슬롯 OPEN</text>
  <path d="M948 905V950" class="edge"/><text x="963" y="934" class="label">4시간 이내</text><rect x="735" y="960" width="425" height="88" rx="8" class="box"/><text x="948" y="994" class="text">WAITING 시스템 CANCELED</text><text x="948" y="1021" class="sub">슬롯 OPEN</text>
  <path d="M1105 835H1180V1133H1095" class="edge"/><text x="1085" y="818" class="label">FIFO WAITING 존재·4시간 전</text><rect x="800" y="1090" width="295" height="86" rx="8" class="box"/><text x="948" y="1124" class="text">OFFERED 전이</text><text x="948" y="1151" class="sub">10분 이하 제안 + 알림 저장</text><path d="M948 1176V1215" class="edge"/>
  <polygon points="948,1222 1095,1292 948,1362 801,1292" class="decision"/><text x="948" y="1298" class="text">보호자 응답</text><path d="M801 1292H735V835H791" class="edge"/><text x="745" y="1275" class="label">거절·만료</text><path d="M1095 1292H1160" class="edge"/><text x="1110" y="1275" class="label">수락</text><rect x="870" y="1370" width="270" height="48" rx="8" class="box"/><text x="1005" y="1401" class="sub">신규 REQUESTED 생성 → 승인 판단 재진입</text><path d="M1160 1292V1394H1140" class="edge"/>

  <rect x="1395" y="630" width="350" height="70" rx="8" class="box"/><text x="1570" y="673" class="text">진료 진행</text><path d="M535 1004H620V190H1245V665H1395" class="edge"/><path d="M1570 700V740" class="edge"/>
  <rect x="1395" y="750" width="350" height="68" rx="8" class="box"/><text x="1570" y="792" class="text">CHECKED_IN</text><path d="M1570 818V850" class="edge"/><rect x="1395" y="860" width="350" height="68" rx="8" class="box"/><text x="1570" y="902" class="text">IN_TREATMENT</text><path d="M1570 928V960" class="edge"/><rect x="1370" y="970" width="400" height="68" rx="8" class="box"/><text x="1570" y="1012" class="text">TREATMENT_COMPLETED</text>
  <path d="M1570 1038V1080" class="edge"/><rect x="1330" y="1090" width="480" height="84" rx="8" class="box"/><text x="1570" y="1124" class="text">병원: 청구 항목 초안 작성·수정</text><text x="1570" y="1151" class="sub">진료 완료 후, 선기록 전까지만</text><path d="M1570 1174V1210" class="edge"/><rect x="1330" y="1220" width="480" height="72" rx="8" class="box"/><text x="1570" y="1264" class="text">항목 합계로 PENDING 결제 선기록</text><path d="M1570 1292V1330" class="edge"/>
  <polygon points="1570,1338 1710,1403 1570,1468 1430,1403" class="decision"/><text x="1570" y="1409" class="text">자동 결제 결과</text><path d="M1430 1403H1290V1538H1315" class="edge"/><text x="1350" y="1386" class="label">실패</text><rect x="1315" y="1490" width="330" height="96" rx="8" class="box"/><text x="1480" y="1522" class="text">OFFLINE_REQUIRED</text><text x="1480" y="1549" class="sub">보호자 결제수단 변경 후 명시적 재청구</text><path d="M1710 1403H1830V1538H1830" class="edge"/><text x="1730" y="1386" class="label">성공</text><rect x="1500" y="1490" width="330" height="96" rx="8" class="box"/><text x="1665" y="1522" class="text">PAID</text><text x="1665" y="1549" class="sub">JSON 영수증 조회 가능</text>

  <rect x="55" y="1480" width="1120" height="240" fill="#fff" stroke="#000" stroke-width="2"/><text x="80" y="1520" class="lane">예외: 병원 휴업·폐업</text><rect x="95" y="1560" width="250" height="70" rx="8" class="box"/><text x="220" y="1603" class="text">병원 휴업·폐업</text><path d="M345 1595H420" class="edge"/><rect x="430" y="1560" width="350" height="70" rx="8" class="box"/><text x="605" y="1603" class="text">CONFIRMED 예약: HOSPITAL_CANCELED</text><path d="M780 1595H855" class="edge"/><rect x="865" y="1560" width="275" height="70" rx="8" class="box"/><text x="1003" y="1590" class="text">활성 WAITING·OFFERED도</text><text x="1003" y="1616" class="sub">시스템 CANCELED → 슬롯 OPEN</text>
</svg>
