<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100" role="img" aria-labelledby="title desc">
  <title id="title">DoctorPet 예약 대기열 비즈니스 플로우</title>
  <desc id="desc">검색부터 승인형 예약, 대기열 자동 승급, 진료, 결제, 병원 휴폐업 예외 처리를 정돈한 흑백 흐름도</desc>
  <defs>
    <style>
      .title{font:700 35px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.section{font:700 23px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.text{font:600 19px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.sub{font:500 15px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.start{text-anchor:start}.label{font:600 15px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2.2}.decision{fill:#fff;stroke:#000;stroke-width:2.2}.edge{stroke:#000;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#000;stroke-width:2;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}.rule{stroke:#000;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#000"/></marker>
  </defs>
  <rect width="1600" height="2100" fill="#fff"/>
  <text x="70" y="70" class="title">DoctorPet 예약 · 대기열 · 진료 · 결제 비즈니스 플로우</text>
  <text x="70" y="101" class="sub start">흑백 발표·노션용 정리본 · 실선은 상태 전이, 점선은 재진입 또는 커밋 후 전달</text>

  <!-- 01 reservation -->
  <text x="70" y="165" class="section">01. 예약 요청과 병원 승인</text><path d="M70 182H1530" class="rule"/>
  <rect x="80" y="230" width="270" height="78" rx="10" class="box"/><text x="215" y="278" class="text">병원 검색·상세 조회</text>
  <path d="M350 269H415" class="edge"/>
  <rect x="425" y="230" width="250" height="78" rx="10" class="box"/><text x="550" y="278" class="text">예약 슬롯 선택</text>
  <path d="M675 269H730" class="edge"/>
  <polygon points="840,205 950,269 840,333 730,269" class="decision"/><text x="840" y="275" class="text">슬롯 상태</text>
  <path d="M950 269H1010" class="edge"/><text x="965" y="251" class="label">OPEN</text>
  <rect x="1020" y="230" width="330" height="78" rx="10" class="box"/><text x="1185" y="263" class="text">예약 요청 생성: REQUESTED</text><text x="1185" y="290" class="sub">슬롯 RESERVED</text>
  <path d="M1185 308V370" class="edge"/>
  <polygon points="1185,378 1310,445 1185,512 1060,445" class="decision"/><text x="1185" y="451" class="text">병원 승인 판단</text>
  <path d="M1185 512V565" class="edge"/><text x="1200" y="545" class="label">승인</text>
  <rect x="1020" y="575" width="330" height="82" rx="10" class="box"/><text x="1185" y="609" class="text">CONFIRMED</text><text x="1185" y="636" class="sub">보호자 알림 저장 → 커밋 후 SSE</text>
  <path d="M1310 445H1560V545H1540" class="edge"/><text x="1330" y="428" class="label">거절·승인 타임아웃</text>
  <rect x="1280" y="506" width="260" height="78" rx="10" class="box"/><text x="1410" y="540" class="text">REJECTED</text><text x="1410" y="567" class="sub">슬롯 반환</text>
  <path d="M840 333V390" class="edge"/><text x="855" y="365" class="label">RESERVED</text>
  <rect x="675" y="400" width="330" height="82" rx="10" class="box"/><text x="840" y="434" class="text">대기열 등록: WAITING</text><text x="840" y="461" class="sub">예약 4시간 전까지만</text>

  <!-- 02 waitlist -->
  <text x="70" y="735" class="section">02. 슬롯 반환과 FIFO 대기열 자동 승급</text><path d="M70 752H1530" class="rule"/>
  <rect x="110" y="800" width="310" height="76" rx="10" class="box"/><text x="265" y="846" class="text">슬롯 반환 이벤트</text>
  <path d="M1410 584V705H265V800" class="edge"/>
  <path d="M840 482V705" class="dash"/>
  <text x="855" y="688" class="sub" text-anchor="start">WAITING은 반환 시점까지 유지</text>
  <path d="M265 876V775H620" class="edge"/>
  <polygon points="620,775 750,838 620,901 490,838" class="decision"/><text x="620" y="844" class="text">활성 대기열 존재?</text>
  <path d="M490 838H450V978H420" class="edge"/><text x="438" y="820" class="label">없음</text>
  <rect x="110" y="940" width="310" height="76" rx="10" class="box"/><text x="265" y="986" class="text">슬롯 OPEN</text>
  <path d="M620 901V940" class="edge"/><text x="635" y="926" class="label">4시간 이내</text>
  <rect x="465" y="950" width="310" height="90" rx="10" class="box"/><text x="620" y="984" class="text">WAITING 시스템 CANCELED</text><text x="620" y="1011" class="sub">슬롯 OPEN</text>
  <path d="M750 838H875" class="edge"/><text x="772" y="820" class="label">FIFO 대기자·4시간 전</text>
  <rect x="885" y="800" width="300" height="76" rx="10" class="box"/><text x="1035" y="834" class="text">OFFERED 전이</text><text x="1035" y="861" class="sub">10분 이하 제안 + 알림 저장</text>
  <path d="M1035 876V930" class="edge"/>
  <polygon points="1035,938 1160,1001 1035,1064 910,1001" class="decision"/><text x="1035" y="1007" class="text">보호자 응답</text>
  <path d="M1160 1001H1280V690H620V775" class="edge"/><text x="1175" y="984" class="label">거절·만료</text>
  <path d="M1035 1064V1115" class="edge"/><text x="1050" y="1096" class="label">수락</text>
  <rect x="850" y="1125" width="370" height="76" rx="10" class="box"/><text x="1035" y="1158" class="text">신규 REQUESTED 생성</text><text x="1035" y="1185" class="sub">기존 병원 승인·거절 흐름으로 재진입</text>
  <path d="M1035 1125V1090H1510V190H1185V230" class="dash"/>

  <!-- 03 care payment -->
  <text x="70" y="1265" class="section">03. 진료 · 청구 · 결제</text><path d="M70 1282H1530" class="rule"/>
  <text x="80" y="1320" class="sub start">CONFIRMED 이후 진료 흐름</text>
  <rect x="1110" y="1328" width="390" height="62" rx="10" class="box"/><text x="1305" y="1354" class="text">예약 단위 채팅</text><text x="1305" y="1377" class="sub">STOMP 메시지 저장 후 전달</text>
  <rect x="1110" y="1405" width="390" height="62" rx="10" class="box"/><text x="1305" y="1431" class="text">예약 알림</text><text x="1305" y="1454" class="sub">보호자 + 소속 병원 스태프 SSE fan-out</text>
  <rect x="80" y="1350" width="220" height="70" rx="10" class="box"/><text x="190" y="1393" class="text">CHECKED_IN</text>
  <path d="M300 1385H360" class="edge"/>
  <rect x="370" y="1350" width="250" height="70" rx="10" class="box"/><text x="495" y="1393" class="text">IN_TREATMENT</text>
  <path d="M620 1385H680" class="edge"/>
  <rect x="690" y="1350" width="310" height="70" rx="10" class="box"/><text x="845" y="1393" class="text">TREATMENT_COMPLETED</text>
  <path d="M845 1420V1470" class="edge"/>
  <rect x="625" y="1480" width="440" height="82" rx="10" class="box"/><text x="845" y="1513" class="text">병원: 청구 항목 초안 작성·수정</text><text x="845" y="1540" class="sub">진료 완료 후, 결제 선기록 전까지만</text>
  <path d="M845 1562V1610" class="edge"/>
  <rect x="625" y="1620" width="440" height="70" rx="10" class="box"/><text x="845" y="1663" class="text">항목 합계로 PENDING 결제 선기록</text>
  <path d="M845 1690V1730" class="edge"/>
  <polygon points="845,1738 980,1801 845,1864 710,1801" class="decision"/><text x="845" y="1807" class="text">자동 결제 결과</text>
  <path d="M710 1801H610" class="edge"/><text x="628" y="1783" class="label">실패</text>
  <rect x="125" y="1760" width="475" height="86" rx="10" class="box"/><text x="362" y="1794" class="text">OFFLINE_REQUIRED</text><text x="362" y="1821" class="sub">보호자 결제수단 변경 후 명시적 재청구</text>
  <path d="M980 1801H1080" class="edge"/><text x="1002" y="1783" class="label">성공</text>
  <rect x="1090" y="1760" width="390" height="86" rx="10" class="box"/><text x="1285" y="1794" class="text">PAID</text><text x="1285" y="1821" class="sub">JSON 영수증 조회 가능</text>

  <!-- exception -->
  <text x="70" y="1920" class="section">예외. 병원 휴업·폐업</text><path d="M70 1937H1530" class="rule"/>
  <rect x="120" y="1970" width="280" height="72" rx="10" class="box"/><text x="260" y="2014" class="text">병원 휴업·폐업</text>
  <path d="M400 2006H485" class="edge"/>
  <rect x="495" y="1970" width="370" height="72" rx="10" class="box"/><text x="680" y="2014" class="text">CONFIRMED: HOSPITAL_CANCELED</text>
  <path d="M865 2006H950" class="edge"/>
  <rect x="960" y="1970" width="500" height="72" rx="10" class="box"/><text x="1210" y="1999" class="text">활성 WAITING·OFFERED 시스템 CANCELED</text><text x="1210" y="2025" class="sub">슬롯 OPEN · 추가 승급 없음</text>
</svg>
