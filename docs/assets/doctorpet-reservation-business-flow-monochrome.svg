<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1620" viewBox="0 0 1800 1620" role="img" aria-labelledby="title desc">
  <title id="title">DoctorPet 예약 대기열 비즈니스 플로우</title>
  <desc id="desc">병원 검색부터 예약 요청, FIFO 대기열 자동 승급, 진료, 결제, 병원 휴폐업 예외 처리까지의 흑백 흐름도</desc>
  <defs>
    <style>
      .title{font:700 34px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.text{font:600 18px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.sub{font:500 15px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000;text-anchor:middle}.label{font:600 15px 'Malgun Gothic','Noto Sans KR',sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2}.decision{fill:#fff;stroke:#000;stroke-width:2}.edge{stroke:#000;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#000;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#000"/></marker>
  </defs>
  <rect width="1800" height="1620" fill="#fff"/>
  <text x="80" y="70" class="title">DoctorPet 예약 · 대기열 · 진료 · 결제 비즈니스 플로우</text>

  <rect x="690" y="105" width="420" height="78" rx="8" class="box"/><text x="900" y="153" class="text">보호자: 병원 검색·상세 조회</text>
  <path d="M900 183V230" class="edge"/>
  <rect x="690" y="240" width="420" height="78" rx="8" class="box"/><text x="900" y="288" class="text">예약 슬롯 선택</text>
  <path d="M900 318V367" class="edge"/>
  <polygon points="900,375 1040,450 900,525 760,450" class="decision"/><text x="900" y="456" class="text">슬롯 상태</text>

  <path d="M1040 450H1225" class="edge"/><text x="1115" y="434" class="label">OPEN</text>
  <rect x="1235" y="410" width="440" height="82" rx="8" class="box"/><text x="1455" y="444" class="text">예약 요청 생성: REQUESTED</text><text x="1455" y="470" class="sub">슬롯 RESERVED</text>
  <path d="M760 450H575" class="edge"/><text x="620" y="434" class="label">RESERVED</text>
  <rect x="125" y="405" width="440" height="92" rx="8" class="box"/><text x="345" y="440" class="text">대기열 등록: WAITING</text><text x="345" y="469" class="sub">4시간 전까지만</text>

  <path d="M1455 492V555" class="edge"/>
  <polygon points="1455,565 1605,640 1455,715 1305,640" class="decision"/><text x="1455" y="646" class="text">병원 승인 판단</text>
  <path d="M1305 640H1115" class="edge"/><text x="1140" y="624" class="label">거절·승인 타임아웃</text>
  <rect x="675" y="598" width="430" height="85" rx="8" class="box"/><text x="890" y="633" class="text">REJECTED</text><text x="890" y="660" class="sub">슬롯 반환</text>
  <path d="M1605 640H1680" class="edge"/><text x="1625" y="624" class="label">승인</text>
  <path d="M1680 640V750H1460" class="edge"/>
  <rect x="1250" y="760" width="420" height="92" rx="8" class="box"/><text x="1460" y="795" class="text">CONFIRMED</text><text x="1460" y="823" class="sub">보호자 알림 저장 → 커밋 후 SSE</text>

  <path d="M345 497V575H600" class="edge"/>
  <path d="M890 683V725H600" class="edge"/>
  <polygon points="600,720 765,795 600,870 435,795" class="decision"/><text x="600" y="801" class="text">활성 대기열 존재?</text>
  <path d="M435 795H215" class="edge"/><text x="305" y="778" class="label">없음</text>
  <rect x="70" y="755" width="140" height="80" rx="8" class="box"/><text x="140" y="803" class="text">슬롯 OPEN</text>
  <path d="M600 870V930" class="edge"/><text x="614" y="904" class="label">4시간 이내</text>
  <rect x="360" y="940" width="480" height="92" rx="8" class="box"/><text x="600" y="975" class="text">WAITING 시스템 CANCELED</text><text x="600" y="1003" class="sub">슬롯 OPEN</text>
  <path d="M765 795H940" class="edge"/><text x="795" y="778" class="label">FIFO WAITING 존재·4시간 전</text>
  <rect x="950" y="750" width="420" height="92" rx="8" class="box"/><text x="1160" y="785" class="text">OFFERED 전이</text><text x="1160" y="813" class="sub">10분 이하 제안 + 알림 저장</text>
  <path d="M1160 842V900" class="edge"/>
  <polygon points="1160,910 1310,985 1160,1060 1010,985" class="decision"/><text x="1160" y="991" class="text">보호자 응답</text>
  <path d="M1010 985H900V795H765" class="edge"/><text x="930" y="969" class="label">거절·만료</text>
  <path d="M1310 985H1455V492" class="edge"/><text x="1330" y="969" class="label">수락</text>

  <path d="M1460 852V920" class="edge"/>
  <polygon points="1460,930 1600,1005 1460,1080 1320,1005" class="decision"/><text x="1460" y="1011" class="text">진료 진행</text>
  <path d="M1460 1080V1120" class="edge"/>
  <rect x="1340" y="1130" width="240" height="72" rx="8" class="box"/><text x="1460" y="1175" class="text">CHECKED_IN</text>
  <path d="M1460 1202V1230" class="edge"/>
  <rect x="1340" y="1240" width="240" height="72" rx="8" class="box"/><text x="1460" y="1285" class="text">IN_TREATMENT</text>
  <path d="M1460 1312V1340" class="edge"/>
  <rect x="1310" y="1350" width="300" height="72" rx="8" class="box"/><text x="1460" y="1395" class="text">TREATMENT_COMPLETED</text>

  <path d="M1310 1386H1065" class="edge"/>
  <rect x="680" y="1350" width="375" height="72" rx="8" class="box"/><text x="868" y="1381" class="text">병원: 청구 항목 초안 작성·수정</text><text x="868" y="1405" class="sub">진료 완료 후, 선기록 전까지만</text>
  <path d="M680 1386H550" class="edge"/>
  <rect x="185" y="1350" width="355" height="72" rx="8" class="box"/><text x="363" y="1381" class="text">항목 합계로 PENDING 결제 선기록</text>
  <path d="M363 1422V1470" class="edge"/>
  <polygon points="363,1480 503,1545 363,1610 223,1545" class="decision"/><text x="363" y="1551" class="text">자동 결제 결과</text>
  <path d="M503 1545H675" class="edge"/><text x="565" y="1528" class="label">성공</text>
  <rect x="685" y="1508" width="350" height="82" rx="8" class="box"/><text x="860" y="1541" class="text">PAID</text><text x="860" y="1568" class="sub">JSON 영수증 조회 가능</text>
  <path d="M223 1545H210" class="edge"/><text x="125" y="1528" class="label">실패</text>
  <rect x="20" y="1472" width="190" height="145" rx="8" class="box"/><text x="115" y="1515" class="text">OFFLINE_REQUIRED</text><text x="115" y="1542" class="sub">보호자 결제수단 변경 후</text><text x="115" y="1567" class="sub">명시적 재청구</text>

  <path d="M1250 805H1070" class="dashed"/>
  <rect x="840" y="865" width="230" height="92" rx="8" class="box"/><text x="955" y="900" class="text">예약 단위 채팅</text><text x="955" y="928" class="sub">STOMP 메시지 저장 후 전달</text>
  <path d="M1250 815H1110V1060" class="dashed"/>
  <rect x="840" y="1070" width="330" height="92" rx="8" class="box"/><text x="1005" y="1105" class="text">예약 알림</text><text x="1005" y="1133" class="sub">보호자 + 병원 스태프 SSE fan-out</text>

  <rect x="70" y="1080" width="440" height="70" rx="8" class="box"/><text x="290" y="1124" class="text">병원 휴업·폐업</text>
  <path d="M510 1115H620" class="edge"/>
  <rect x="630" y="1080" width="360" height="70" rx="8" class="box"/><text x="810" y="1124" class="text">CONFIRMED 예약: HOSPITAL_CANCELED</text>
  <path d="M810 1150V1210" class="edge"/>
  <rect x="570" y="1220" width="480" height="75" rx="8" class="box"/><text x="810" y="1250" class="text">활성 WAITING·OFFERED도 시스템 CANCELED</text><text x="810" y="1276" class="sub">슬롯 OPEN</text>
</svg>
