plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Workaround for Gradle 9.x on Windows with non-ASCII project paths:
// If the project path contains Korean (or other non-ASCII) characters, the @argfile
// written for the test worker classpath gets corrupted (UTF-8 written, MS949 read).
// To fix, set 'localBuildDir' to an ASCII-only base path in your personal
// GRADLE_USER_HOME/gradle.properties (global, never committed):
//   localBuildDir=C:/gradle-build
// The build dir is <localBuildDir>/<project name>-<hash of absolute path> so that
// separate clones or Git worktrees of the same repo never share one build directory
// (a parallel build or clean in one would otherwise wipe the other's outputs).
if (project.hasProperty('localBuildDir')) {
    def pathHash = Integer.toHexString(rootDir.absolutePath.hashCode())
    layout.buildDirectory = file("${project.property('localBuildDir')}/${rootProject.name}-${pathHash}")
}

group = 'com.doctorpet'
version = '0.0.1-SNAPSHOT'
description = 'DoctorPet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '5.1.0'
    jjwtVersion = '0.12.6'
    proj4jVersion = '1.4.2'
    // Spring Boot 4(Jackson 3) 호환 확인된 최신 버전(이슈 #105). springdoc이 아직 내부적으로
    // Jackson 2에 의존하는 이슈가 알려져 있어(springdoc-openapi#3200), 로컬 빌드에서 문제가
    // 보이면 이 버전부터 의심할 것.
    springdocOpenapiVersion = '3.1.0'
    // 반려동물 프로필 이미지 presigned URL 발급(S3ImageStorageGateway)에 사용. BOM으로 하위
    // 모듈(s3 등) 버전을 한 곳에서 관리한다.
    awsSdkVersion = '2.51.2'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 배포 헬스체크(CI/CD MVP)·운영 지표 노출용. /actuator/health를 배포 스크립트가 확인한다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 관측성 지표(이슈 #105) — /actuator/prometheus가 Prometheus 텍스트 포맷으로 지표를 노출하게
    // 해주는 Micrometer 레지스트리. 이 의존성이 없으면 /actuator/metrics(JSON)까지만 되고
    // Prometheus가 스크레이프할 수 있는 형식은 나오지 않는다.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // API 문서화(이슈 #105). local 프로파일에서만 활성화한다(SecurityConfig·application.yaml
    // 참고) — docker/prod로 배포된 서버는 인터넷에 노출돼 있어, 기본값으로 켜두면 병원 스태프
    // 운영 API를 포함한 전체 API 스펙이 누구에게나 공개된다.
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocOpenapiVersion}"
    // 이메일 인증·비밀번호 재설정 메일 발송(SA §6-1 백로그 P2). mail.provider=smtp일 때만 사용된다
    // (JavaMailSender 빈은 MailConfig에서 mail.provider 값에 따라 조건부로 생성).
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Hibernate가 LocalTime이 포함된 운영시간을 MySQL JSON으로 변환할 때 사용합니다.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // 공공데이터의 투영 좌표를 검색에 사용하는 WGS84 경위도로 변환합니다.
    implementation "org.locationtech.proj4j:proj4j:${proj4jVersion}"
    implementation "org.locationtech.proj4j:proj4j-epsg:${proj4jVersion}"
    // 반려동물 프로필 이미지 업로드(S3 presigned URL, image.storage.provider=s3일 때만 사용).
    // S3Presigner만 필요하므로 SDK 전체가 아니라 s3 모듈만 받는다(EmailGateway의
    // spring-boot-starter-mail처럼, 실제 발급은 S3ImageStorageGateway·StorageConfig에서 조건부로
    // 이뤄진다).
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    // QueryDSL
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// QueryDSL Q-type 생성 경로
def querydslDir = "build/generated/querydsl"

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean.doLast {
    file(querydslDir).deleteDir()
}

tasks.named('test') {
    useJUnitPlatform()
    // CI에서 공통 Spring 컨텍스트 초기화가 실패할 때 실제 SQL 원인을 로그로 남긴다.
    // 후속 테스트는 동일 컨텍스트 실패로 연쇄 실패할 수 있으므로 최초 예외가 진단 가능해야 한다.
    testLogging {
        showExceptions = true
        showCauses = true
        exceptionFormat = 'full'
    }
    // 통합 테스트(@SpringBootTest)는 설정별로 ApplicationContext를 캐시하고 각 컨텍스트가 Hikari 커넥션 풀을
    // 따로 유지한다. 통합 테스트가 늘며 (캐시된 컨텍스트 수 × 기본 풀 10)이 MySQL max_connections(기본 151)를
    // 넘어, 뒤늦게 로딩되는 컨텍스트가 "Too many connections"로 컨텍스트 로딩에 실패했다(Dialect 결정 불가).
    // 컨텍스트 캐시 크기를 제한해 동시에 살아있는 풀 수를 묶는다 — evict된 컨텍스트는 풀을 닫으므로 동시 커넥션이
    // 최대 12×10=120으로 상한된다(<151). 풀 크기 자체는 줄이지 않아 동시성 테스트의 병렬성은 그대로 유지한다.
    systemProperty 'spring.test.context.cache.maxSize', '12'
}

// Spring Boot Gradle 플러그인은 기본으로 실행 가능한 bootJar 외에 archiveClassifier="plain"인
// 일반 jar도 build/libs/에 함께 만든다. 이 프로젝트는 그 plain jar를 쓸 일이 없고, 남겨두면
// CI/CD 배포용 Dockerfile이 `build/libs/*.jar`로 산출물을 골라올 때 두 개가 매칭돼 실패한다.
// 그래서 아예 끈다.
tasks.named('jar') {
    enabled = false
}
