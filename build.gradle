plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Workaround for Gradle 9.x on Windows with non-ASCII project paths:
// If the project path contains Korean (or other non-ASCII) characters, the @argfile
// written for the test worker classpath gets corrupted (UTF-8 written, MS949 read).
// To fix, set 'localBuildDir' to an ASCII-only base path in your personal
// GRADLE_USER_HOME/gradle.properties (global, never committed):
//   localBuildDir=C:/gradle-build
// The build dir is <localBuildDir>/<project name>-<hash of absolute path> so that
// separate clones or Git worktrees of the same repo never share one build directory
// (a parallel build or clean in one would otherwise wipe the other's outputs).
if (project.hasProperty('localBuildDir')) {
    def pathHash = Integer.toHexString(rootDir.absolutePath.hashCode())
    layout.buildDirectory = file("${project.property('localBuildDir')}/${rootProject.name}-${pathHash}")
}

group = 'com.doctorpet'
version = '0.0.1-SNAPSHOT'
description = 'DoctorPet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '5.1.0'
    jjwtVersion = '0.12.6'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Hibernate가 LocalTime이 포함된 운영시간을 MySQL JSON으로 변환할 때 사용합니다.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    // QueryDSL
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// QueryDSL Q-type 생성 경로
def querydslDir = "build/generated/querydsl"

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean.doLast {
    file(querydslDir).deleteDir()
}

tasks.named('test') {
    useJUnitPlatform()
}
