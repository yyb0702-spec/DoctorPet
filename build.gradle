plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Workaround for Gradle 9.x on Windows with non-ASCII project paths:
// If the project path contains Korean (or other non-ASCII) characters, the @argfile
// written for the test worker classpath gets corrupted (UTF-8 written, MS949 read).
// To fix, set 'localBuildDir' to an ASCII-only base path in your personal
// GRADLE_USER_HOME/gradle.properties (global, never committed):
//   localBuildDir=C:/gradle-build
// The build dir is <localBuildDir>/<project name>-<hash of absolute path> so that
// separate clones or Git worktrees of the same repo never share one build directory
// (a parallel build or clean in one would otherwise wipe the other's outputs).
if (project.hasProperty('localBuildDir')) {
    def pathHash = Integer.toHexString(rootDir.absolutePath.hashCode())
    layout.buildDirectory = file("${project.property('localBuildDir')}/${rootProject.name}-${pathHash}")
}

group = 'com.doctorpet'
version = '0.0.1-SNAPSHOT'
description = 'DoctorPet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '5.1.0'
    jjwtVersion = '0.12.6'
    proj4jVersion = '1.4.2'
    // Spring Boot 4(Jackson 3) 호환 확인된 최신 버전(이슈 #105). springdoc이 아직 내부적으로
    // Jackson 2에 의존하는 이슈가 알려져 있어(springdoc-openapi#3200), 로컬 빌드에서 문제가
    // 보이면 이 버전부터 의심할 것.
    springdocOpenapiVersion = '3.1.0'
    // 반려동물 프로필 이미지 presigned URL 발급(S3ImageStorageGateway)에 사용. BOM으로 하위
    // 모듈(s3 등) 버전을 한 곳에서 관리한다.
    awsSdkVersion = '2.51.2'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 배포 헬스체크(CI/CD MVP)·운영 지표 노출용. /actuator/health를 배포 스크립트가 확인한다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 관측성 지표(이슈 #105) — /actuator/prometheus가 Prometheus 텍스트 포맷으로 지표를 노출하게
    // 해주는 Micrometer 레지스트리. 이 의존성이 없으면 /actuator/metrics(JSON)까지만 되고
    // Prometheus가 스크레이프할 수 있는 형식은 나오지 않는다.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // API 문서화(이슈 #105). local 프로파일에서만 활성화한다(SecurityConfig·application.yaml
    // 참고) — docker/prod로 배포된 서버는 인터넷에 노출돼 있어, 기본값으로 켜두면 병원 스태프
    // 운영 API를 포함한 전체 API 스펙이 누구에게나 공개된다.
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocOpenapiVersion}"
    // 이메일 인증·비밀번호 재설정 메일 발송(SA §6-1 백로그 P2). mail.provider=smtp일 때만 사용된다
    // (JavaMailSender 빈은 MailConfig에서 mail.provider 값에 따라 조건부로 생성).
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Hibernate가 LocalTime이 포함된 운영시간을 MySQL JSON으로 변환할 때 사용합니다.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // 공공데이터의 투영 좌표를 검색에 사용하는 WGS84 경위도로 변환합니다.
    implementation "org.locationtech.proj4j:proj4j:${proj4jVersion}"
    implementation "org.locationtech.proj4j:proj4j-epsg:${proj4jVersion}"
    // 반려동물 프로필 이미지 업로드(S3 presigned URL, image.storage.provider=s3일 때만 사용).
    // S3Presigner만 필요하므로 SDK 전체가 아니라 s3 모듈만 받는다(EmailGateway의
    // spring-boot-starter-mail처럼, 실제 발급은 S3ImageStorageGateway·StorageConfig에서 조건부로
    // 이뤄진다).
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    // QueryDSL
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// QueryDSL Q-type 생성 경로
def querydslDir = "build/generated/querydsl"

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean.doLast {
    file(querydslDir).deleteDir()
}

tasks.named('test') {
    useJUnitPlatform()
    // CI에서 공통 Spring 컨텍스트 초기화가 실패할 때 실제 SQL 원인을 로그로 남긴다.
    // 후속 테스트는 동일 컨텍스트 실패로 연쇄 실패할 수 있으므로 최초 예외가 진단 가능해야 한다.
    testLogging {
        showExceptions = true
        showCauses = true
        exceptionFormat = 'full'
    }
    // 통합 테스트(@SpringBootTest)는 설정별로 ApplicationContext를 캐시하고 각 컨텍스트가 Hikari 커넥션 풀을
    // 따로 유지한다. 통합 테스트가 늘며 (캐시된 컨텍스트 수 × 기본 풀 10)이 MySQL max_connections(기본 151)를
    // 넘어, 뒤늦게 로딩되는 컨텍스트가 "Too many connections"로 컨텍스트 로딩에 실패했다(Dialect 결정 불가).
    // 컨텍스트 캐시 크기를 제한해 동시에 살아있는 풀 수를 묶는다 — evict된 컨텍스트는 풀을 닫으므로 동시 커넥션이
    // 최대 12×10=120으로 상한된다(<151). 풀 크기 자체는 줄이지 않아 동시성 테스트의 병렬성은 그대로 유지한다.
    systemProperty 'spring.test.context.cache.maxSize', '12'

    // integrationTest(아래)와 같은 이유로 동일하게 제한한다(2차 리뷰 지적 P1) — 이 태스크는
    // *IntegrationTest 82개를 필터 없이 전부 포함하는 상위집합이라, integrationTest에만 걸어둔
    // 캐시 예외로는 이 태스크를 막지 못한다. 로컬 build cache(~/.gradle)는 `clean`을 살아남으므로,
    // `./gradlew clean build`나 `./gradlew test`를 코드 변경 없이 재실행하면 MySQL·Redis에 한 번도
    // 접속하지 않고 FROM-CACHE로 PASS가 뜰 수 있다 — docs/testing/verification-guide.md가 Level 1·3
    // 검증 명령으로 바로 이 태스크(test)를 지정하므로, 실행하지 않은 검증을 완료로 오판하게 만든다.
    outputs.doNotCacheIf('통합 테스트(*IntegrationTest)를 포함해 외부 MySQL·Redis 상태에 의존한다 — 캐시 히트 시 실제 DB 검증 없이 통과 처리될 수 있다') {
        true
    }
}

// CI 최적화 — ci.yml이 Level 1/2(빠름, MySQL·Redis 불필요)와 Level 3(느림, MySQL·Redis 필요,
// docs/testing/verification-guide.md)를 서로 다른 GitHub Actions 잡으로 나눠 병렬 실행할 수
// 있도록, 클래스명 규칙(*IntegrationTest로 끝나는지, 실제로 100% 일치함을 확인했다)으로 테스트를
// 둘로 쪼갠 전용 태스크다. 기존 `test`/`build`(로컬 개발, Dockerfile 등에서 계속 씀)는 그대로
// 전체를 실행하도록 손대지 않았다 — 이 두 태스크는 CI 전용 추가분이다.
tasks.register('unitTest', Test) {
    group = 'verification'
    description = 'Level 1/2 — MySQL·Redis 없이 도는 테스트만 실행한다(CI 최적화, 클래스명이 *IntegrationTest로 안 끝남).'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        excludeTestsMatching '*IntegrationTest'
    }
    testLogging {
        showExceptions = true
        showCauses = true
        exceptionFormat = 'full'
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Level 3 — MySQL·Redis가 필요한 통합 테스트만 실행한다(CI 최적화, 클래스명이 *IntegrationTest로 끝남).'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching '*IntegrationTest'
    }
    testLogging {
        showExceptions = true
        showCauses = true
        exceptionFormat = 'full'
    }
    // 위 tasks.named('test')와 같은 이유로 동일하게 제한한다 — 이 태스크가 바로 그
    // "통합 테스트만 모은" 태스크라 이 값이 실제로 의미를 갖는 지점이다.
    systemProperty 'spring.test.context.cache.maxSize', '12'

    // (재검토 반영) org.gradle.caching=true가 이 Test 태스크에도 적용되는데, Gradle의 입력
    // 추적은 테스트 클래스·클래스패스만 볼 뿐 CI가 띄우는 실제 MySQL·Redis 컨테이너의 상태(서비스
    // 이미지 버전, 데이터 등)는 입력으로 잡지 않는다. 그래서 코드가 안 바뀐 채 같은 커밋을
    // 재실행하거나 ci.yml의 서비스 설정만 바뀌면, 실제 DB·동시성 검증을 한 번도 안 하고
    // FROM-CACHE로 통과 처리될 수 있다 — Level 3 잡의 존재 이유 자체를 무력화하는 위험이라
    // 통합 테스트 출력 캐시는 끈다. compileJava/compileTestJava 등 순수 컴파일 캐시(org.gradle.caching
    // 자체)는 그대로 유지한다 — 이 태스크 하나만 예외로 뺀다.
    outputs.doNotCacheIf('Level 3 통합 테스트는 외부 MySQL·Redis 상태에 의존하고, 그 상태는 태스크 입력으로 추적되지 않는다 — 캐시 히트 시 실제 DB 검증 없이 통과 처리될 수 있다') {
        true
    }
}

// Spring Boot Gradle 플러그인은 기본으로 실행 가능한 bootJar 외에 archiveClassifier="plain"인
// 일반 jar도 build/libs/에 함께 만든다. 이 프로젝트는 그 plain jar를 쓸 일이 없고, 남겨두면
// CI/CD 배포용 Dockerfile이 `build/libs/*.jar`로 산출물을 골라올 때 두 개가 매칭돼 실패한다.
// 그래서 아예 끈다.
tasks.named('jar') {
    enabled = false
}
