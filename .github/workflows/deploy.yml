name: Deploy

# CI(Build and Test) 워크플로가 develop 브랜치에서 성공적으로 끝난 뒤에만 배포한다(리뷰 지적
# P1) — 이전에는 CI와 별개로 push 이벤트에서 바로 트리거돼서, 같은 커밋의 테스트가 실패해도
# 이미지 빌드(테스트를 스킵하는 `gradlew bootJar -x test`)만 성공하면 배포가 그대로 진행되는
# 문제가 있었다. workflow_run으로 CI 완료를 기다리고 conclusion이 success일 때만 진행한다.
#
# main이 아니라 develop을 기준으로 쓰는 이유: 이 프로젝트는 develop이 실질적인 최신 개발
# 브랜치이고, main은 아직 정식 릴리스 시점(develop -> main)에만 갱신되는 상태라 지금 당장은
# main 기준으로 두면 배포가 전혀 안 돈다. 나중에 main 릴리스 절차가 자리잡으면 다시 검토할 것.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

# 배포가 겹쳐 돌면(연속 push 등) 서버 상태가 꼬일 수 있어 직렬화한다(리뷰 지적 P1). 진행 중인
# 배포를 취소하지 않고 대기열에 세워 순서대로 처리한다.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.resolve_sha.outputs.sha }}

    steps:
      - name: Resolve deploy SHA
        id: resolve_sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_sha.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest 태그는 여기서 갱신하지 않는다(리뷰 지적 P2) — workflow_run 완료 순서가
          # 보장되지 않아, 오래된 커밋의 빌드·푸시가 최신 커밋보다 늦게 끝나면 latest가
          # 실제로는 더 과거 이미지를 가리키게 될 수 있다. EC2는 항상 SHA 태그로만 배포하므로
          # latest 태그 자체가 필요 없다 — 로컬 개발도 build: .로 직접 빌드해 image 이름만
          # 로컬 태그로 쓰는 것이라 GHCR의 latest 태그 존재 여부와 무관하다.
          tags: ghcr.io/yyb0702-spec/doctorpet:${{ steps.resolve_sha.outputs.sha }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # EC2의 SSH(22)를 상시 0.0.0.0/0으로 열어두지 않는다(리뷰 지적 P1) — 이미 만들어둔
      # EC2_HOST/EC2_USERNAME/EC2_SSH_KEY/GHCR_READ_TOKEN 시크릿을 그대로 쓰기 위해
      # self-hosted runner 대신, 배포가 실행되는 이 짧은 구간에만 GitHub Actions 러너의
      # 현재 공인 IP를 보안 그룹에 임시로 허용하고 배포가 끝나면(성공/실패 무관) 회수하는
      # 방식을 쓴다. AWS 자격증명은 이 보안 그룹의 ingress 규칙 추가/삭제만 가능한 최소
      # 권한 IAM 사용자를 별도로 만들어 사용한다.
      - name: Configure AWS credentials (SG 임시 허용용)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve runner public IP
        id: runner_ip
        run: echo "cidr=$(curl -s https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      - name: Authorize runner IP for SSH (temporary)
        run: |
          # revoke가 실패했던 이전 실행이 있으면 같은 CIDR 규칙이 이미 남아있을 수 있다
          # (리뷰 지적 P2) — 그대로 authorize하면 InvalidPermission.Duplicate로 이 스텝이
          # 실패한다. 먼저 같은 CIDR을 (있으면) 지우고 나서 새로 추가해 항상 idempotent하게
          # 만든다. 규칙이 원래 없어서 나는 에러는 무시한다.
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.runner_ip.outputs.cidr }}" 2>/dev/null || true

          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.runner_ip.outputs.cidr }}"

      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ needs.build-and-push.outputs.sha }}
          GHCR_READ_USERNAME: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_SHA,GHCR_READ_USERNAME,GHCR_READ_TOKEN
          script: |
            set -e
            cd ~/DoctorPet

            # EC2가 GHCR private 패키지를 pull할 수 있도록 로그인한다(리뷰 지적 P1) — 빌드
            # 잡은 러너에서 GITHUB_TOKEN으로 로그인하지만, 그건 러너 세션일 뿐 이 EC2 SSH
            # 세션과는 무관하다. read:packages 권한만 있는 PAT를 GHCR_READ_TOKEN 시크릿으로
            # 등록해서 쓴다.
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_READ_USERNAME" --password-stdin

            git fetch origin "$DEPLOY_SHA"

            PREV_SHA="$(cat .last_deployed_sha 2>/dev/null || true)"

            # workflow_run은 CI 완료 순서를 보장하지 않는다 — 느리게 끝난 이전 커밋의 배포가
            # 나중에 도착하면, 이미 배포된 최신 SHA 위에 오래된 SHA를 덮어쓸 수 있다. 이번
            # DEPLOY_SHA가 이미 배포된 커밋보다 진짜 오래된 조상일 때만 건너뛴다(리뷰 지적 P2)
            # — git merge-base --is-ancestor는 커밋을 자기 자신의 조상으로도 취급하므로,
            # DEPLOY_SHA == PREV_SHA(같은 커밋 재배포/복구)인 경우까지 스킵되지 않도록 동일
            # SHA는 명시적으로 제외한다. .last_deployed_sha는 "현재 활성 색이 돌리는 SHA"를
            # 뜻하며 blue/green 전환 후에도 이 의미 그대로 갱신한다(무중단 배포 문서 5절).
            if [ -n "$PREV_SHA" ] && [ "$DEPLOY_SHA" != "$PREV_SHA" ] \
               && git merge-base --is-ancestor "$DEPLOY_SHA" "$PREV_SHA" 2>/dev/null; then
              echo "이미 더 최신 커밋($PREV_SHA)이 배포되어 있어 $DEPLOY_SHA 배포를 건너뜁니다."
              exit 0
            fi

            # 이미지와 Compose 설정을 같은 커밋으로 고정한다(리뷰 지적 P1) — git pull로 실행
            # 시점의 최신 develop을 쓰면, CI를 통과한 이미지(SHA A)와 그 사이 develop에 병합된
            # 최신 docker-compose.yml(SHA B)이 조합돼 환경변수·포트·서비스 구조가 어긋난 채로
            # 배포될 수 있다. detached HEAD로 정확히 DEPLOY_SHA 시점의 파일을 사용한다.
            #
            # .active_color·.last_deployed_sha·nginx/conf.d/upstream-active.conf는 git으로
            # 추적하지 않는다(.gitignore) — 이 checkout이 서버의 실제 컷오버 상태를 되돌리지
            # 않는다.
            git checkout --detach "$DEPLOY_SHA"

            # 무중단 배포(blue/green) — docs/architecture/DoctorPet-무중단배포.md 참고.
            # .active_color가 없으면 이 서버에서의 최초 배포로 보고 blue를 그대로 대상으로
            # 삼는다(컷오버할 기존 색이 없으므로).
            ACTIVE_COLOR="$(cat .active_color 2>/dev/null || true)"
            if [ -z "$ACTIVE_COLOR" ]; then
              TARGET_COLOR="blue"
            elif [ "$ACTIVE_COLOR" = "blue" ]; then
              TARGET_COLOR="green"
            else
              TARGET_COLOR="blue"
            fi

            # nginx가 최초로 뜰 때 읽을 업스트림 설정이 아직 없으면 만든다(최초 배포 전용
            # 경로) — 이후 배포에서는 이미 파일이 있어 이 블록은 아무 일도 하지 않는다.
            # heredoc 대신 printf를 쓴다 — 이 script 블록은 YAML 리터럴 블록이라 heredoc
            # 종료 구분자에 들여쓰기가 섞이면(bash는 구분자 줄에 공백이 있으면 종료로 인식하지
            # 않는다) 스크립트 전체가 깨질 수 있어, 애초에 그 위험이 없는 방식을 쓴다.
            #
            # FIRST_DEPLOY(.active_color가 없던 시점) 여부를 여기서 고정해 둔다 — 이 파일이
            # 방금 새로 만들어졌다면, 아직 존재하지 않는 app-$TARGET_COLOR:8080을 가리키는
            # 상태다(리뷰 지적). nginx가 이 설정을 읽는 시점에 그 호스트가 실제로 없으면
            # "호스트가 없어서 502를 반환"하는 게 아니라 nginx 자체가 "host not found in
            # upstream"으로 설정 로드에 실패할 수 있다 — 아래에서 nginx 기동 순서를 이 플래그로
            # 분기한다(대상 앱을 먼저 띄우고 헬스체크까지 통과한 뒤에만 nginx를 올린다).
            FIRST_DEPLOY=false
            mkdir -p nginx/conf.d
            if [ ! -f nginx/conf.d/upstream-active.conf ]; then
              FIRST_DEPLOY=true
              printf 'upstream app_upstream {\n    server app-%s:8080;\n    keepalive 16;\n}\n' "$TARGET_COLOR" > nginx/conf.d/upstream-active.conf
            fi

            # 1회성 마이그레이션 — 이 변경 이전에는 app 컨테이너가 호스트 포트 8080을 직접
            # 게시하고 있었다. 이제 nginx가 8080을 게시해야 하는데, 옛 app 컨테이너가 아직 그
            # 포트를 물고 있으면 nginx가 뜨지 못하고 충돌한다. docker compose가 아니라 원시
            # docker 명령으로 "8080을 게시 중이면서 이름에 app이 들어간" 컨테이너를 찾아
            # 정리한다 — app-blue/app-green은 애초에 호스트 포트를 게시하지 않으므로 이 필터에
            # 절대 걸리지 않고, 이후 배포에서는 옛 app 컨테이너 자체가 없어 이 블록은 항상
            # 아무 일도 하지 않는다(멱등).
            OLD_APP_CONTAINER="$(docker ps -q --filter "publish=8080" --filter "name=app")"
            if [ -n "$OLD_APP_CONTAINER" ]; then
              echo "이전 단일 app 컨테이너가 8080을 게시 중이라 정리합니다(1회성 마이그레이션): $OLD_APP_CONTAINER"
              docker stop "$OLD_APP_CONTAINER"
              docker rm "$OLD_APP_CONTAINER"
            fi

            # 인프라 3종(mysql/redis/nginx)만 대상으로 삼는다 — 이미지·설정이 안 바뀌는 한
            # 재시작되지 않고, 혹시 안 떠 있으면(최초 배포, 서버 재부팅 등) 복구한다.
            # app-blue/app-green은 이름을 명시하지 않아 대상에서 제외된다(서버에서 대상
            # 미지정 `docker compose up -d`를 쓰지 않는다는 원칙과 같은 이유,
            # docker-compose.yml 상단 주석·무중단 배포 문서 7절).
            #
            # FIRST_DEPLOY면 nginx는 여기서 올리지 않는다(리뷰 지적) — 방금 써둔
            # upstream-active.conf가 가리키는 app-$TARGET_COLOR가 아직 존재하지 않아 nginx가
            # 설정 로드에 실패할 수 있다. 대상 앱을 기동·헬스체크로 검증한 뒤 아래에서 올린다.
            if [ "$FIRST_DEPLOY" = "true" ]; then
              docker compose up -d mysql redis
            else
              docker compose up -d mysql redis nginx
            fi

            # latest가 아니라 이번에 빌드된 정확한 SHA 이미지를 대상 색에만 지정해서 띄운다
            # (리뷰 지적 P1과 동일한 이유) — 활성 색은 새 이미지를 pull·재시작하지 않으므로
            # 이 시점까지 운영 트래픽은 그대로 기존 색이 받는다.
            if [ "$TARGET_COLOR" = "blue" ]; then
              export APP_BLUE_IMAGE_TAG="$DEPLOY_SHA"
            else
              export APP_GREEN_IMAGE_TAG="$DEPLOY_SHA"
            fi
            docker compose pull "app-$TARGET_COLOR"
            docker compose up -d --no-deps "app-$TARGET_COLOR"

            # docker compose up -d 성공은 "컨테이너가 시작 요청됐다"는 뜻일 뿐 애플리케이션이
            # 정상 기동했다는 보장이 아니다(리뷰 지적 P1). Dockerfile의 HEALTHCHECK가 판단하는
            # healthy 상태를 대상 색 컨테이너에서 직접 폴링해서 확인한다. 컨테이너 이름을
            # 하드코딩하지 않고(리뷰 지적 P3) compose가 실제로 만든 컨테이너 ID를 조회해서
            # 쓴다 — 디렉터리명/COMPOSE_PROJECT_NAME이 바뀌어도 안전하다.
            ATTEMPTS=0
            MAX_ATTEMPTS=18
            until [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "app-$TARGET_COLOR")" 2>/dev/null)" = "healthy" ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
                # target 색만 정리하고 nginx·활성 색(ACTIVE_COLOR)은 전혀 건드리지 않는다 —
                # 운영 트래픽은 이 실패한 배포 시도를 겪지 않는다. 기존의 "이전 SHA로 능동
                # 재배포" 롤백보다 훨씬 단순하고 안전하다(무중단 배포 문서 4-3절).
                echo "새 색($TARGET_COLOR, $DEPLOY_SHA)이 제한 시간 내 healthy 상태가 되지 않아 배포를 중단합니다. 활성 색(${ACTIVE_COLOR:-없음, 최초 배포})은 그대로입니다."
                docker compose stop "app-$TARGET_COLOR" 2>/dev/null || true
                docker compose rm -f "app-$TARGET_COLOR" 2>/dev/null || true
                exit 1
              fi
              sleep 10
            done

            # FIRST_DEPLOY는 대상 앱이 healthy로 확인된 지금에서야 nginx를 올린다(리뷰 지적) —
            # 이 시점에는 nginx/conf.d/upstream-active.conf가 가리키는 app-$TARGET_COLOR가
            # 실제로 떠 있으므로 정적 upstream 호스트 해석이 실패하지 않는다.
            if [ "$FIRST_DEPLOY" = "true" ]; then
              docker compose up -d --no-deps nginx
            fi

            # 컷오버 — nginx가 대상 색을 보게 설정을 바꾸고 reload한다. -t로 문법 검증을 먼저
            # 하지 않고 reload하면, 설정이 잘못됐을 때 nginx가 기존 워커를 유지한 채 조용히
            # 실패해 "컷오버 안 됨"을 스크립트가 놓칠 수 있다(무중단 배포 문서 7절).
            printf 'upstream app_upstream {\n    server app-%s:8080;\n    keepalive 16;\n}\n' "$TARGET_COLOR" > nginx/conf.d/upstream-active.conf
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload

            # reload는 그레이스풀해서 이미 연결된 요청은 이전 업스트림(ACTIVE_COLOR)으로 마저
            # 처리된다 — 그 요청들이 끝날 시간을 짧게 준 뒤에만 이전 색을 정지한다. 최초
            # 배포라 ACTIVE_COLOR가 없으면 정지할 대상 자체가 없다.
            if [ -n "$ACTIVE_COLOR" ]; then
              sleep 5
              # stop이지 rm이 아니다 — 컨테이너를 지우지 않고 정지만 해서 다음 배포 때 같은
              # 서비스를 그대로 재사용한다(재생성 오버헤드를 줄인다).
              docker compose stop "app-$ACTIVE_COLOR"
            fi

            # healthy와 컷오버가 모두 확인된 뒤에만 상태를 갱신하고 dangling 이미지를 정리한다.
            echo "$DEPLOY_SHA" > .last_deployed_sha
            echo "$TARGET_COLOR" > .active_color
            docker image prune -f

      # 배포 성공/실패와 무관하게 임시로 허용했던 러너 IP는 반드시 회수한다(리뷰 지적 P1) —
      # 여기서 실패하면 보안 그룹에 열린 IP가 그대로 남으므로 always()로 강제 실행한다.
      - name: Revoke runner IP for SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.runner_ip.outputs.cidr }}"
