# Grafana가 기동 시 자동으로 읽어 들이는 데이터소스 프로비저닝 설정(UI에서 수동으로 추가할 필요
# 없음). docker-compose.yml의 grafana 서비스가 이 디렉터리째(monitoring/grafana/provisioning)를
# /etc/grafana/provisioning으로 마운트한다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
