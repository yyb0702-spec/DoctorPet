# Prometheus 스크레이프 설정 — docker-compose.yml의 prometheus 서비스가 읽어 들인다.
# app-blue/app-green 둘 다 항상 타겟으로 등록해둔다 — 평소엔 활성 색 하나만 컨테이너가 떠 있어서
# 비활성 색 타겟은 up=0(down)으로 보이는 게 정상이다(무중단 배포 blue/green 구조상 당연한 상태이지,
# 장애가 아니다). Grafana 대시보드·알림 규칙에서는 반드시 up==1인 인스턴스만 걸러서 봐야 한다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: doctorpet-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-blue:8081"]
        labels:
          color: blue
      - targets: ["app-green:8081"]
        labels:
          color: green

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
