# CI/CD 배포 MVP — nginx+app-blue/green+MySQL+Redis를 한 번에 띄운다. 로컬 검증과 실제 서버
# (EC2) 배포에 그대로 재사용한다. 실제 값(JWT_SECRET, DB 비밀번호 등)은 .env 파일에 채운다
# (.env.example 참고, .env 자체는 .gitignore에 등록해 커밋하지 않는다).
#
# 무중단 배포(blue/green) 구조 — docs/architecture/DoctorPet-무중단배포.md 참고. app 서비스가
# app-blue/app-green 둘로 나뉘고, 호스트 포트 8080은 nginx가 갖는다(예전엔 app이 직접 가졌다).
# 평소엔 활성 색 하나만 컨테이너가 떠 있고, 배포하는 짧은 구간에만 두 색이 동시에 뜬다. 서버에서는
# 절대 대상 서비스를 지정하지 않은 `docker compose up -d`를 실행하지 않는다 — 항상 배포 스크립트가
# `--no-deps app-<color>`로 대상 색만 지정한다(주의사항, 위 문서 7절). app-green에 profiles:
# ["green"]을 둔 것도 같은 이유 — 그냥 `docker compose up -d`(로컬 개발 등)가 실수로 green까지
# 건드리지 않도록 기본 프로파일에서 제외한다.
#
# 기본 프로파일이 docker인 이유: .env.example 기본값은 payment.gateway=fake, mail.provider=
# fake라 결제·메일이 실제로 연동되지 않는다. ProductionSafetyGuard가 prod 프로파일 + fake
# 조합이면 부팅 자체를 막으므로, 아직 PortOne·SMTP 실연동 준비가 안 된 이 인프라 검증
# 단계에서는 prod가 아닌 docker 프로파일로 띄운다. 실제 운영 launch 시에는 payment.gateway=
# portone, mail.provider=smtp로 값을 채우고 .env의 SPRING_PROFILES_ACTIVE를 prod로 바꿀 것
# (아래 app.environment의 SPRING_PROFILES_ACTIVE는 하드코딩이 아니라 .env 값을 그대로 따른다,
# 리뷰 지적 P2).
# app-blue/app-green이 공유하는 환경변수 모음(x- 확장 필드는 Compose가 서비스로 해석하지
# 않고 YAML 앵커 용도로만 쓴다). AUDIT_LOG_DIR만은 여기 넣지 않고 각 서비스가 직접
# 선언한다(리뷰 지적) — 두 색이 같은 payment-audit-logs 볼륨을 공유하는 채로 로그백
# RollingFileAppender가 같은 파일(payment-audit.log)에 동시에 append하면, 한쪽의
# 롤오버(rename)를 다른 프로세스가 모른 채 계속 써서 컷오버 구간에 감사 로그가
# 유실·덮어써질 수 있다. 색별로 하위 디렉터리를 나눠 물리적으로 다른 파일에 쓰게 한다.
x-app-common-env: &app-common-env
  # DB·Redis는 같은 docker compose 네트워크 안의 서비스명으로 접속하므로 .env에서 채울
  # 필요가 없다 — 컨테이너 사이 연결 정보이지 비밀값이 아니다.
  # 하드코딩하지 않고 외부에서 덮어쓸 수 있게 한다(리뷰 지적 P2) — 이전엔 값을 고정해둬서
  # 서버 .env에 SPRING_PROFILES_ACTIVE=prod를 넣어도 실제로는 계속 docker 프로파일로 떠서,
  # ProductionSafetyGuard가 영원히 동작하지 않는 문제가 있었다. .env.example의
  # SPRING_PROFILES_ACTIVE를 참고할 것 — 실연동 준비 전에는 절대 prod로 바꾸지 말 것
  # (payment.gateway/mail.provider가 fake면 부팅 자체가 막힌다).
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  # DB 접속 정보를 .env에서 덮어쓸 수 있게 한다(RDS 이관 대응) — 기본값은 로컬 mysql 서비스를
  # 그대로 가리키므로 로컬 개발·기존 EC2 동작은 변경이 없다. RDS로 전환하려면 EC2의 git
  # 비추적 .env에 SPRING_DATASOURCE_URL/USERNAME/PASSWORD를 채우면 된다.
  #
  # SPRING_DATASOURCE_USERNAME/PASSWORD는 MYSQL_ROOT_PASSWORD(로컬 mysql 컨테이너 초기화용)와
  # 완전히 분리된 별도 변수다(RDS PR 재검토 지적 P1) — 예전엔 앱 비밀번호를 MYSQL_ROOT_PASSWORD
  # 값 그대로 재사용했는데, RDS 전환 시 그 값이 곧 RDS 마스터 비밀번호였다. 즉 앱 컨테이너나
  # EC2 환경변수가 노출되면 `doctorpet` 스키마 접근을 넘어 RDS 인스턴스 관리 권한(다른 스키마
  # 접근, 사용자 생성/삭제 등)까지 새는 구조였다. RDS로 전환할 때는 반드시 `doctorpet` 스키마
  # 권한만 가진 전용 사용자를 만들어(아래 .env.example 안내 참고) 그 계정 정보를 여기 채우고,
  # 마스터 계정(admin 등)은 사용자 생성·수동 점검 같은 관리 작업에만 쓴다.
  #
  # 중첩 변수 참조(`${A:-${B:-c}}`)는 Docker Compose가 지원하지 않아(공식 문서에 관련 언급
  # 자체가 없음, 지원 시 오동작 위험) SPRING_DATASOURCE_PASSWORD를 "없으면 MYSQL_ROOT_PASSWORD로
  # 자동 폴백"하게 만들 수 없다 — 이 분리 자체가 그 폴백을 포기하고 대신 얻는 격리다. 로컬
  # 개발에서 MYSQL_ROOT_PASSWORD를 기본값(root)에서 바꿨다면, SPRING_DATASOURCE_PASSWORD도
  # .env에 같은 값으로 별도로 채워야 한다(.env.example 참고) — 둘 다 기본값 그대로면 로컬
  # mysql의 root/root와 일치해 아무것도 안 채워도 그대로 동작한다.
  SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/doctorpet?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
  # Redis 접속 정보도 DB와 같은 방식으로 .env에서 덮어쓸 수 있게 한다(ElastiCache 이관 완료,
  # 이슈 #169). 기본값은 이 compose 파일이 같이 띄우는 로컬 redis 서비스를 그대로 가리켜 로컬
  # 개발 동작은 변경이 없다 — EC2는 이미 ElastiCache로 전환됐고 이 로컬 redis 서비스는
  # deploy.yml의 EC2 배포 대상에서 빠져 있다(무중단배포 문서 4-3·7절 참고, 컷오버 후에는 EC2에서
  # 실제로 내려야 한다). 로컬 redis는 requirepass·TLS가 없으므로 PASSWORD 기본값은 빈 문자열
  # (비밀번호 없음과 동일), SSL_ENABLED 기본값은 false다. ElastiCache로 전환할 때는 HOST/PORT/
  # PASSWORD를 채우고, 클러스터에 전송 중 암호화(TLS)를 켰다면 SSL_ENABLED도 true로 같이 바꿔야
  # 한다(.env.example 참고) — 이 값들은 Spring Boot의 spring.data.redis.* 표준 프로퍼티에 relaxed
  # binding으로 매핑되므로 별도 코드 변경이 필요 없다(RedisConnectionFactory를 커스텀 설정하는
  # 코드가 없어 전부 자동 구성에 의존한다).
  SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
  # 값 전체를 따옴표로 감싼다(재검토 지적 P3, 근거 정정) — Docker Compose의 변수 치환은 이미
  # 파싱된 YAML 값(문자열로 이미 확정된 스칼라) 안에서 텍스트만 바꾸고, 그 결과를 YAML로 다시
  # 파싱하지 않는다(docker compose config로 직접 재현 — 따옴표를 떼도 "6379"/"false"로 그대로
  # 나온다). 즉 따옴표가 타입 안전성에 실제로 영향을 주진 않는다 — 다만 값이 그대로 문자열임을
  # 코드만 보고도 명확히 알 수 있게 하는 스타일 표기로 남겨둔다.
  SPRING_DATA_REDIS_PORT: "${SPRING_DATA_REDIS_PORT:-6379}"
  # USERNAME 변수가 기본으로 없는 건 실수가 아니다(리뷰 지적 P1 대응, .env.example 참고) — ElastiCache
  # RBAC 사용자의 Username을 AWS가 안내하는 대로 "default"로 만들면(User ID는 달라도 됨), Redis/Valkey의
  # AUTH 명령이 사용자명 없이 비밀번호만 줘도 암묵적으로 "default"를 대상으로 인증하므로(공식 문서:
  # "the single argument form... assumes that the implicit username is default") PASSWORD만으로
  # 정확히 그 RBAC 사용자로 인증된다(실제 EC2에서 actuator UP까지 확인됨). 다만 지금 그 사용자는
  # on ~* +@all(전체 권한)이라 최소 권한은 아니다(재검토 지적) — 나중에 키 패턴을 좁힌 이름 있는
  # 전용 사용자로 바꾸려면 아래 USERNAME을 채우면 된다(AUTH <username> <password> 2-인자 필요).
  SPRING_DATA_REDIS_USERNAME: ${SPRING_DATA_REDIS_USERNAME:-}
  SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
  SPRING_DATA_REDIS_SSL_ENABLED: "${SPRING_DATA_REDIS_SSL_ENABLED:-false}"
  # nginx 리버스 프록시 도입 후 request.getRemoteAddr()는 실제 사용자가 아니라 nginx
  # 컨테이너 IP가 된다. AiClientIpResolver는 remoteAddr가 이 목록에 있을 때만
  # X-Forwarded-For를 신뢰하므로, 비워두면 익명 AI 상담 요청이 모두 nginx IP 하나로
  # 집계돼 서로 다른 사용자가 서버 전체 공유 한도(분당 3회·일 30회)로 429를 받는다.
  #
  # (리뷰 지적 P1, 재수정) 처음에는 nginx에 networks.default.ipam.config로 고정 IP를
  # 부여하고 그 IP를 여기 하드코딩했었다. 그런데 mysql/redis는 이 PR 이전부터 서브넷
  # 지정 없는 기존 default 네트워크에 이미 붙어 있는 채로 EC2에 이 PR이 배포되므로,
  # docker compose가 네트워크 설정 변경(서브넷 신규 지정)을 감지해 네트워크를 재생성하려
  # 시도하다 "network has active endpoints"로 실패할 위험이 있었다 — 무중단 배포
  # 파이프라인 자체가 최초 실행에서 막히는 문제였다. 고정 IP 대신 컴포즈가 항상 제공하는
  # 서비스명 DNS("nginx")를 그대로 신뢰 대상으로 등록한다 — AiClientIpResolver가 이제
  # 호스트명을 해석해 비교하므로(리뷰 지적 대응) 네트워크 토폴로지를 전혀 바꾸지 않고도
  # 같은 보호를 얻는다.
  AI_RATE_LIMIT_TRUSTED_PROXIES: nginx

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: doctorpet
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    # 호스트 포트를 게시하지 않는다(리뷰 지적 P2) — app은 같은 compose 네트워크 안에서
    # mysql:3306으로 붙으므로 호스트 노출이 필요 없고, 노출해두면 보안그룹/방화벽 실수 시
    # 바로 공격 경로가 된다. 로컬에서 DB 클라이언트로 직접 붙어야 하면
    # docker-compose.override.yml.example을 참고해 개발용 override에서만 loopback으로 열 것.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 호스트 포트를 게시하지 않는다(리뷰 지적 P2) — 이 Redis는 인증(requirepass)이 없어서
    # 그대로 노출되면 Rate Limit 카운터·기타 캐시 데이터에 누구나 접근할 수 있다. app은
    # redis:6379로 내부 접속하므로 호스트 노출 자체가 불필요하다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # app-blue/app-green — 무중단 배포용 두 색(docs/architecture/DoctorPet-무중단배포.md). 둘은
  # image 태그 환경변수·서비스명(따라서 컨테이너명)·감사 로그 디렉터리(AUDIT_LOG_DIR, 리뷰
  # 지적으로 색별 분리)만 다르고 나머지(*app-common-env)는 완전히 동일하다. 평소엔 활성 색
  # 하나만 떠 있고, 배포 스크립트가 비활성 색에 새 이미지를 올려 헬스체크를 통과시킨 뒤
  # nginx를 그쪽으로 reload하고 나서야 기존 색을 정지한다.
  app-blue: &app
    # 로컬: docker compose up --build app-blue로 Dockerfile을 직접 빌드해서 image 이름으로
    # 태깅한다. EC2 배포: GitHub Actions가 미리 빌드해 GHCR에 push해둔 이미지를 build 없이
    # pull만 해서 쓴다(`docker compose pull app-<color> && docker compose up -d --no-deps
    # app-<color>`) — EC2에서 매번 Gradle 빌드를 돌리면 리소스가 부족해 느리고 불안정하다는 걸
    # 이미 겪었기 때문(CI/CD 자동배포 단계).
    build: .
    # APP_BLUE_IMAGE_TAG/APP_GREEN_IMAGE_TAG는 배포 스크립트가 대상 색에 맞춰 그때그때
    # export한다(리뷰 지적 P1 패턴 재사용) — 두 색이 서로 다른 SHA를 동시에 돌릴 수 있어야
    # 하므로(컷오버 전환 구간) 기존처럼 변수 하나(APP_IMAGE_TAG)를 공유하면 안 된다. latest는
    # 쓰지 않고 폴백은 local로 둔다(로컬 개발은 build: .가 직접 태깅하므로 이 값 자체가 실제로
    # 안 쓰이고, 서버에서 실수로 태그 없이 pull하면 존재하지 않는 태그라 곧바로 명확하게 실패한다).
    image: ghcr.io/yyb0702-spec/doctorpet:${APP_BLUE_IMAGE_TAG:-local}
    restart: unless-stopped
    # 컷오버 시 이전 색을 정지할 때(deploy.yml, docker compose stop) Docker가 SIGTERM 이후
    # 기다려주는 시간(리뷰 지적 P1, PR #136) — 기본값 10초는 application.yaml의
    # spring.lifecycle.timeout-per-shutdown-phase(30초)보다 짧아서, Spring Boot가 진행 중인
    # 요청(결제·AI 상담 등)을 다 처리하기 전에 Docker가 먼저 SIGKILL을 보내버릴 수 있었다.
    # 30초보다 여유를 둬 Spring Boot의 graceful shutdown이 항상 먼저 끝나도록 한다.
    stop_grace_period: 35s
    # 호스트 포트를 게시하지 않는다 — mysql·redis와 동일 원칙(리뷰 지적 P2)으로, 이제 nginx만
    # 8080을 게시하고 app-blue/app-green은 nginx가 속한 같은 compose 네트워크 안에서만
    # app-blue:8080 / app-green:8080으로 접근된다. 액추에이터(8081)도 여전히 비공개.
    env_file:
      - .env
    environment:
      <<: *app-common-env
      # 청구 감사 로그를 남길 디렉터리(PR #91, 색별 분리는 리뷰 지적 대응). 아래
      # payment-audit-logs 볼륨 안의 색별 하위 디렉터리에 마운트해, 컷오버로 어느 색이
      # 활성이든 감사 파일이 사라지지 않으면서도 blue·green이 물리적으로 다른 파일
      # (payment-audit.log)에 쓰게 한다 — logback의 SizeAndTimeBasedRollingPolicy는 같은
      # 파일에 여러 JVM이 동시에 append·롤오버하는 상황을 지원하지 않으므로, 같은 파일을
      # 공유하면 컷오버 구간에 롤오버 경합으로 로그가 유실·덮어써질 수 있다.
      AUDIT_LOG_DIR: /app/logs/blue
    volumes:
      # 청구 감사 로그 영속 볼륨 — 컨테이너 수명과 분리해 배포/재기동 후에도 사후 추적을 가능하게 한다.
      - payment-audit-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-green:
    <<: *app
    # green은 기본 프로파일에서 제외한다 — 대상을 지정하지 않은 `docker compose up -d`(로컬
    # 개발 등)가 실수로 두 색을 동시에 띄우지 않도록 하는 구조적 안전장치다(무중단 배포 문서
    # 7절 "주의사항"). 배포 스크립트처럼 서비스명을 명시하면 프로파일과 무관하게 그대로 동작한다.
    profiles: ["green"]
    image: ghcr.io/yyb0702-spec/doctorpet:${APP_GREEN_IMAGE_TAG:-local}
    # environment를 명시적으로 다시 선언한다 — YAML 병합 키(<<: *app)는 이 키를 통째로
    # app-blue에서 그대로 가져오므로, 여기서 다시 선언하지 않으면 AUDIT_LOG_DIR도 blue와
    # 똑같이 /app/logs/blue가 되어 감사 로그 파일 분리(위 AUDIT_LOG_DIR 주석 참고)가
    # 무의미해진다. 공통 값은 *app-common-env로 그대로 재사용하고 AUDIT_LOG_DIR만 바꾼다.
    environment:
      <<: *app-common-env
      AUDIT_LOG_DIR: /app/logs/green

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # 이제 호스트 포트 8080은 nginx가 갖는다 — app-blue/app-green 중 활성 색으로만 리버스
    # 프록시한다(docs/architecture/DoctorPet-무중단배포.md). 컷오버는 nginx 설정 파일을 바꾸고
    # `nginx -s reload`하는 방식이라 컨테이너 재시작 없이 순간적으로 전환된다.
    #
    # 80/443은 doctorpet.click 도메인·HTTPS 연결(무중단배포 문서 3-1절)로 추가됐다 — 8080은
    # 기존 접근 경로를 당장 끊지 않기 위해 그대로 남겨뒀다(nginx/nginx.conf 상단 주석 참고).
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      # nginx.conf 단일 파일이 아니라 nginx/ 디렉터리 전체를 하나로 마운트한다(운영 배포 반영
      # 안 됨 버그 수정 — /ws/chat WebSocket 프록시 블록이 코드에는 있는데 실제 컨테이너
      # 안에는 없던 사고). 원인: Docker의 단일 파일 bind mount는 마운트 시점의 특정 inode에
      # 고정된다. git checkout은 파일을 in-place로 수정하지 않고 unlink 후 새로 만드는(새
      # inode) 방식이라, 이미 떠 있는 컨테이너의 파일 마운트는 그 새 inode를 못 보고 예전
      # 내용에 계속 고정된 채 남는다 — 컨테이너를 재생성(recreate)하지 않는 한 절대 안 바뀐다.
      # deploy.yml은 `docker compose up -d ... nginx`를 매 배포마다 실행하긴 하지만
      # `--force-recreate`가 없어 nginx 서비스 정의(compose 설정) 자체가 안 바뀌는 한
      # 컨테이너를 재생성하지 않는다 — 그래서 이 문제가 무기한 지속됐다.
      # 반면 디렉터리 bind mount는 안의 파일이 바뀌어도 경로 조회가 매번 새로 일어나 항상
      # 최신 내용을 본다 — conf.d가 원래부터 디렉터리 마운트라 이 문제가 없었고(배포 스크립트의
      # upstream-active.conf 컷오버가 항상 정상 반영됐던 이유), nginx.conf만 파일 마운트라
      # 취약했다. 아래 entrypoint의 심볼릭 링크로 기존 /etc/nginx/nginx.conf,
      # /etc/nginx/conf.d 경로를 그대로 쓰면서 실제 파일은 이 디렉터리 마운트 밑에 둬 두
      # 경로 모두 동일하게 안전해진다 — deploy.yml의 `nginx -t`/`nginx -s reload`(기본 경로
      # 사용) 쪽은 수정할 필요가 없다.
      #
      # conf.d 안의 upstream-active.conf는 배포 스크립트가 서버에서 직접 덮어쓰는 파일이라
      # git으로 추적하지 않는다(.gitignore 참고). 로컬 개발은
      # nginx/conf.d/upstream-active.conf.example을 복사해서 만든다.
      - ./nginx:/etc/nginx/custom:ro
      # access/error 로그를 컨테이너 쓰기 레이어가 아니라 영속 볼륨에 남긴다(payment-audit-logs와
      # 같은 이유) — nginx는 blue/green과 달리 거의 재시작되지 않아 로그가 쓰기 레이어에 무기한
      # 쌓이는 걸 막고, 컨테이너가 교체돼도 이력이 남게 한다. 로테이션은 이번 범위에 포함하지
      # 않는다(운영 규모가 커지면 별도로 검토, 무중단 배포 문서 참고).
      - nginx-logs:/var/log/nginx
      # doctorpet.click HTTPS(무중단배포 문서 3-1절) — certbot 서비스와 이 두 볼륨을 공유한다.
      # certbot-etc에는 발급된 인증서(nginx.conf가 읽는 /etc/letsencrypt/live/doctorpet.click/*)가
      # 담긴다 — 평소엔 certbot만 쓰지만, 최초 부팅 시 이 경로에 아직 아무 인증서도 없으면
      # 아래 entrypoint가 자체 서명 임시 인증서를 여기 직접 만들어 nginx가 뜰 수 있게 하므로
      # (닭과 달걀 문제, nginx.conf 443 서버 블록 주석 참고) 쓰기 가능하게 마운트한다.
      # certbot-webroot는 ACME HTTP-01 챌린지 파일(certbot이 쓰고 nginx가 80에서 서빙)만 담아
      # nginx는 읽기만 하면 돼 읽기 전용으로 마운트한다.
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot:ro
    # 이미지 기본 /etc/nginx/nginx.conf, /etc/nginx/conf.d(둘 다 실제 파일/디렉터리로 이미지
    # 안에 존재)를 지우고, 위에서 통째로 마운트한 /etc/nginx/custom 밑의 같은 이름을 가리키는
    # 심볼릭 링크로 바꾼 뒤 nginx를 시작한다. rm 없이 ln -sf만 쓰면 대상이 실제 디렉터리(conf.d)일
    # 때 링크가 그 안에 생겨버려 교체가 안 된다 — 그래서 rm -rf 후 ln으로 완전히 교체한다.
    # -c 옵션으로 커스텀 경로를 nginx에 직접 넘기는 대신 이 심볼릭 링크 방식을 쓴 이유: deploy.yml의
    # `nginx -t`/`nginx -s reload`가 기본 경로(/etc/nginx/nginx.conf)를 그대로 쓰므로, 배포
    # 스크립트를 전혀 건드리지 않고 마운트 방식만 바꿔서 버그를 고칠 수 있다.
    #
    # (리뷰 지적 P2, 최초 버전에서 정정) command(CMD)가 아니라 entrypoint(ENTRYPOINT)를 덮어써서
    # 심볼릭 링크 설정을 한다 — 최초 버전은 command만 `/bin/sh -c "... && exec nginx ..."`로
    # 바꿨는데, 이러면 컨테이너에 전달되는 첫 인자($1)가 "nginx"가 아니라 "/bin/sh"가 돼버려
    # nginx 공식 ENTRYPOINT(/docker-entrypoint.sh)의 `[ "$1" = 'nginx' ]` 조건이 거짓이 되고,
    # /docker-entrypoint.d/의 초기화 스크립트(IPv6 기본 리스닝, envsubst 템플릿 처리, worker
    # process 튜닝 등)가 스킵된다. 이 프로젝트가 변경 전 원래 compose 설정에는 command 자체가
    # 없어 이미지 기본 CMD(`nginx -g daemon off;`, 첫 인자가 정확히 "nginx")를 그대로 썼으므로,
    # 그 스크립트들은 이 PR 이전에는 실제로 실행되고 있었다 — "원래부터 실행 안 됐다"는 최초
    # 버전의 설명은 틀렸다(리뷰 지적이 정확함). 지금은 템플릿·envsubst를 안 써서 실질 영향은
    # 작지만, 이미지 업데이트나 향후 템플릿 도입 시 조용히 회귀할 수 있는 위험이라 command
    # 대신 아래처럼 ENTRYPOINT를 감싸는 방식으로 바꿔, 심볼릭 링크 설정 이후 원래
    # docker-entrypoint.sh를 "nginx"를 첫 인자로 그대로 넘겨 호출한다.
    # (리뷰 지적 P0, 재정정) entrypoint를 설정하면 Compose는 이미지의 기본 CMD를
    # 아예 무시한다("If entrypoint is non-null, Compose ignores any default command
    # from the image" — Docker Compose 공식 문서). 즉 command를 같이 지정하지 않으면
    # 위 스크립트의 "$@"가 완전히 비어버려서 exec /docker-entrypoint.sh "$@"가 인자 없이
    # 호출되고, docker-entrypoint.sh 내부의 [ "$1" = 'nginx' ] 조건이 거짓이 되어
    # /docker-entrypoint.d/ 초기화 스크립트뿐 아니라 마지막의 `exec "$@"`(nginx 기동 자체)도
    # 실행되지 않는다 — nginx가 뜨지 않고 컨테이너가 즉시 종료되며 restart: unless-stopped로
    # 크래시루프에 빠진다. 그래서 아래 command를 명시적으로 함께 지정해 이미지 기본 CMD와
    # 동일한 인자를 다시 채워 넣는다.
    #
    # doctorpet.click HTTPS 부트스트랩(무중단배포 문서 3-1절) — nginx.conf의 443 서버 블록은
    # /etc/letsencrypt/live/doctorpet.click/{fullchain,privkey}.pem을 읽는데, 이 서버에서
    # certbot이 실제 인증서를 발급받기 전(최초 배포, 볼륨 초기화 등)에는 이 파일이 없다. 파일이
    # 없으면 nginx가 설정 검증(nginx -t) 단계에서부터 뜨지 못하는데, nginx가 안 뜨면 80 서버
    # 블록의 ACME 챌린지 응답도 불가능해져 certbot이 애초에 인증서를 발급받을 방법이 없다(닭과
    # 달걀 문제) — 그래서 파일이 없을 때만 자체 서명 임시 인증서를 그 경로에 직접 만들어 nginx가
    # 일단 뜨게 한다. certbot이 실제 인증서 발급에 성공하면 같은 경로의 파일을 실제 인증서로
    # 덮어쓰므로, 다음 컨테이너 재시작부터는 이 if 블록이 조건에 안 걸려 아무 일도 하지 않는다.
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -rf /etc/nginx/nginx.conf /etc/nginx/conf.d &&
        ln -s /etc/nginx/custom/nginx.conf /etc/nginx/nginx.conf &&
        ln -s /etc/nginx/custom/conf.d /etc/nginx/conf.d &&
        if [ ! -f /etc/letsencrypt/live/doctorpet.click/fullchain.pem ]; then
          echo "doctorpet.click 인증서가 아직 없어 자체 서명 임시 인증서를 생성합니다 (닭과 달걀 문제 — nginx.conf 443 서버 블록 주석 참고). certbot이 실제 인증서를 발급하면 이 파일은 교체됩니다." &&
          apk add --no-cache openssl >/dev/null &&
          mkdir -p /etc/letsencrypt/live/doctorpet.click &&
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/live/doctorpet.click/privkey.pem \
            -out /etc/letsencrypt/live/doctorpet.click/fullchain.pem \
            -subj "/CN=doctorpet.click";
        fi &&
        exec /docker-entrypoint.sh "$@"
      - custom-entrypoint-shim
    command: ["nginx", "-g", "daemon off;"]
    # app-blue/app-green을 depends_on으로 걸지 않는다 — 걸면 `docker compose up -d nginx`가
    # (기본 프로파일인) app-blue까지 같이 시작시키려 들어, 배포 스크립트가 아직 대상 색의
    # 이미지 태그를 export하기 전 타이밍에 엉뚱한 태그(local 폴백)로 기동을 시도할 수 있다.
    # nginx는 컷오버 대상 색과 독립적으로 항상 떠 있어야 하는 서비스라 이 결합을 두지 않는 게
    # 맞다 — 업스트림이 아직 안 떠 있으면 그 사이 요청은 502를 받을 뿐, nginx 자체는 정상 기동한다.

  # doctorpet.click 인증서 발급·갱신 전용(무중단배포 문서 3-1절) — mysql/redis와 같은 이유로
  # deploy.yml이 관리하는 "상시 인프라"가 아니다. 이 서비스는 up -d 대상에 포함하지 않고,
  # 필요할 때(최초 발급, 갱신) `docker compose run --rm certbot ...`으로 직접 실행하는 1회성
  # 도구다 — 그래서 restart 정책도, 상시 실행을 뜻하는 command도 두지 않는다. 최초 발급·갱신
  # 명령 예시는 무중단배포 문서 3-1절 참고.
  certbot:
    image: certbot/certbot:v5.6.0
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  # 모니터링 스택(Prometheus+Grafana)은 docker-compose.monitoring.yml로 분리했다(재리뷰
  # 지적 P1) — 이전엔 여기 있었는데, GRAFANA_ADMIN_PASSWORD가 이 파일 안의 유일한 `:?`
  # 필수 변수였다. Docker Compose는 대상 서비스와 무관하게 파일 전체를 파싱 시점에 보간하므로,
  # EC2 .env에 이 값이 없으면 `up`뿐 아니라 `ps`·`pull`·`exec`까지 이 파일을 쓰는 모든
  # docker compose 명령이 죽어 app-blue/green 배포·컷오버·롤백이 전부 불가능해지는 문제가
  # 있었다(deploy.yml은 set -e 아래라 첫 호출에서 스크립트 전체가 끝난다). 파일을 분리하면
  # 이 변수의 영향 범위가 그 파일 하나로 좁아지고, deploy.yml도 이 스택의 기동 실패를
  # 경고로만 흡수해 앱 배포를 막지 않도록 바꿨다(SA.md §12 참고). project 이름(디렉터리
  # 기준)이 같은 채로 별도 파일만 쓰므로 컨테이너들은 여전히 같은 기본 네트워크에 붙어
  # prometheus가 app-blue/app-green을 서비스명으로 스크레이프할 수 있다.

volumes:
  mysql-data:
  payment-audit-logs:
  nginx-logs:
  # doctorpet.click 인증서(certbot-etc)·ACME 챌린지 파일(certbot-webroot) — nginx·certbot
  # 서비스 정의 참고.
  certbot-etc:
  certbot-webroot:
