# CI/CD 배포 MVP — app+MySQL+Redis를 한 번에 띄운다. 로컬 검증과 실제 서버(EC2) 배포에 그대로
# 재사용한다. 실제 값(JWT_SECRET, DB 비밀번호 등)은 .env 파일에 채운다(.env.example 참고,
# .env 자체는 .gitignore에 등록해 커밋하지 않는다).
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: doctorpet
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      # 로컬 호스트에 이미 3306을 쓰는 MySQL이 있을 수 있어 노출 포트만 3307로 바꿨다.
      # 컨테이너 내부 통신(app -> mysql:3306)에는 영향 없다 — 호스트에서 직접 3306으로
      # 붙어야 할 때만(DB 클라이언트 등) 3307로 접속하면 된다.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # DB·Redis는 같은 docker compose 네트워크 안의 서비스명으로 접속하므로 .env에서 채울
      # 필요가 없다 — 컨테이너 사이 연결 정보이지 비밀값이 아니다.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctorpet?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
