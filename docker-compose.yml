# CI/CD 배포 MVP — nginx+app-blue/green+MySQL+Redis를 한 번에 띄운다. 로컬 검증과 실제 서버
# (EC2) 배포에 그대로 재사용한다. 실제 값(JWT_SECRET, DB 비밀번호 등)은 .env 파일에 채운다
# (.env.example 참고, .env 자체는 .gitignore에 등록해 커밋하지 않는다).
#
# 무중단 배포(blue/green) 구조 — docs/architecture/DoctorPet-무중단배포.md 참고. app 서비스가
# app-blue/app-green 둘로 나뉘고, 호스트 포트 8080은 nginx가 갖는다(예전엔 app이 직접 가졌다).
# 평소엔 활성 색 하나만 컨테이너가 떠 있고, 배포하는 짧은 구간에만 두 색이 동시에 뜬다. 서버에서는
# 절대 대상 서비스를 지정하지 않은 `docker compose up -d`를 실행하지 않는다 — 항상 배포 스크립트가
# `--no-deps app-<color>`로 대상 색만 지정한다(주의사항, 위 문서 7절). app-green에 profiles:
# ["green"]을 둔 것도 같은 이유 — 그냥 `docker compose up -d`(로컬 개발 등)가 실수로 green까지
# 건드리지 않도록 기본 프로파일에서 제외한다.
#
# 기본 프로파일이 docker인 이유: .env.example 기본값은 payment.gateway=fake, mail.provider=
# fake라 결제·메일이 실제로 연동되지 않는다. ProductionSafetyGuard가 prod 프로파일 + fake
# 조합이면 부팅 자체를 막으므로, 아직 PortOne·SMTP 실연동 준비가 안 된 이 인프라 검증
# 단계에서는 prod가 아닌 docker 프로파일로 띄운다. 실제 운영 launch 시에는 payment.gateway=
# portone, mail.provider=smtp로 값을 채우고 .env의 SPRING_PROFILES_ACTIVE를 prod로 바꿀 것
# (아래 app.environment의 SPRING_PROFILES_ACTIVE는 하드코딩이 아니라 .env 값을 그대로 따른다,
# 리뷰 지적 P2).
# app-blue/app-green이 공유하는 환경변수 모음(x- 확장 필드는 Compose가 서비스로 해석하지
# 않고 YAML 앵커 용도로만 쓴다). AUDIT_LOG_DIR만은 여기 넣지 않고 각 서비스가 직접
# 선언한다(리뷰 지적) — 두 색이 같은 payment-audit-logs 볼륨을 공유하는 채로 로그백
# RollingFileAppender가 같은 파일(payment-audit.log)에 동시에 append하면, 한쪽의
# 롤오버(rename)를 다른 프로세스가 모른 채 계속 써서 컷오버 구간에 감사 로그가
# 유실·덮어써질 수 있다. 색별로 하위 디렉터리를 나눠 물리적으로 다른 파일에 쓰게 한다.
x-app-common-env: &app-common-env
  # DB·Redis는 같은 docker compose 네트워크 안의 서비스명으로 접속하므로 .env에서 채울
  # 필요가 없다 — 컨테이너 사이 연결 정보이지 비밀값이 아니다.
  # 하드코딩하지 않고 외부에서 덮어쓸 수 있게 한다(리뷰 지적 P2) — 이전엔 값을 고정해둬서
  # 서버 .env에 SPRING_PROFILES_ACTIVE=prod를 넣어도 실제로는 계속 docker 프로파일로 떠서,
  # ProductionSafetyGuard가 영원히 동작하지 않는 문제가 있었다. .env.example의
  # SPRING_PROFILES_ACTIVE를 참고할 것 — 실연동 준비 전에는 절대 prod로 바꾸지 말 것
  # (payment.gateway/mail.provider가 fake면 부팅 자체가 막힌다).
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctorpet?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  # nginx 리버스 프록시 도입 후 request.getRemoteAddr()는 실제 사용자가 아니라 nginx
  # 컨테이너 IP가 된다. AiClientIpResolver는 remoteAddr가 이 목록에 있을 때만
  # X-Forwarded-For를 신뢰하므로, 비워두면 익명 AI 상담 요청이 모두 nginx IP 하나로
  # 집계돼 서로 다른 사용자가 서버 전체 공유 한도(분당 3회·일 30회)로 429를 받는다.
  #
  # (리뷰 지적 P1, 재수정) 처음에는 nginx에 networks.default.ipam.config로 고정 IP를
  # 부여하고 그 IP를 여기 하드코딩했었다. 그런데 mysql/redis는 이 PR 이전부터 서브넷
  # 지정 없는 기존 default 네트워크에 이미 붙어 있는 채로 EC2에 이 PR이 배포되므로,
  # docker compose가 네트워크 설정 변경(서브넷 신규 지정)을 감지해 네트워크를 재생성하려
  # 시도하다 "network has active endpoints"로 실패할 위험이 있었다 — 무중단 배포
  # 파이프라인 자체가 최초 실행에서 막히는 문제였다. 고정 IP 대신 컴포즈가 항상 제공하는
  # 서비스명 DNS("nginx")를 그대로 신뢰 대상으로 등록한다 — AiClientIpResolver가 이제
  # 호스트명을 해석해 비교하므로(리뷰 지적 대응) 네트워크 토폴로지를 전혀 바꾸지 않고도
  # 같은 보호를 얻는다.
  AI_RATE_LIMIT_TRUSTED_PROXIES: nginx

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: doctorpet
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    # 호스트 포트를 게시하지 않는다(리뷰 지적 P2) — app은 같은 compose 네트워크 안에서
    # mysql:3306으로 붙으므로 호스트 노출이 필요 없고, 노출해두면 보안그룹/방화벽 실수 시
    # 바로 공격 경로가 된다. 로컬에서 DB 클라이언트로 직접 붙어야 하면
    # docker-compose.override.yml.example을 참고해 개발용 override에서만 loopback으로 열 것.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 호스트 포트를 게시하지 않는다(리뷰 지적 P2) — 이 Redis는 인증(requirepass)이 없어서
    # 그대로 노출되면 Rate Limit 카운터·기타 캐시 데이터에 누구나 접근할 수 있다. app은
    # redis:6379로 내부 접속하므로 호스트 노출 자체가 불필요하다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # app-blue/app-green — 무중단 배포용 두 색(docs/architecture/DoctorPet-무중단배포.md). 둘은
  # image 태그 환경변수·서비스명(따라서 컨테이너명)·감사 로그 디렉터리(AUDIT_LOG_DIR, 리뷰
  # 지적으로 색별 분리)만 다르고 나머지(*app-common-env)는 완전히 동일하다. 평소엔 활성 색
  # 하나만 떠 있고, 배포 스크립트가 비활성 색에 새 이미지를 올려 헬스체크를 통과시킨 뒤
  # nginx를 그쪽으로 reload하고 나서야 기존 색을 정지한다.
  app-blue: &app
    # 로컬: docker compose up --build app-blue로 Dockerfile을 직접 빌드해서 image 이름으로
    # 태깅한다. EC2 배포: GitHub Actions가 미리 빌드해 GHCR에 push해둔 이미지를 build 없이
    # pull만 해서 쓴다(`docker compose pull app-<color> && docker compose up -d --no-deps
    # app-<color>`) — EC2에서 매번 Gradle 빌드를 돌리면 리소스가 부족해 느리고 불안정하다는 걸
    # 이미 겪었기 때문(CI/CD 자동배포 단계).
    build: .
    # APP_BLUE_IMAGE_TAG/APP_GREEN_IMAGE_TAG는 배포 스크립트가 대상 색에 맞춰 그때그때
    # export한다(리뷰 지적 P1 패턴 재사용) — 두 색이 서로 다른 SHA를 동시에 돌릴 수 있어야
    # 하므로(컷오버 전환 구간) 기존처럼 변수 하나(APP_IMAGE_TAG)를 공유하면 안 된다. latest는
    # 쓰지 않고 폴백은 local로 둔다(로컬 개발은 build: .가 직접 태깅하므로 이 값 자체가 실제로
    # 안 쓰이고, 서버에서 실수로 태그 없이 pull하면 존재하지 않는 태그라 곧바로 명확하게 실패한다).
    image: ghcr.io/yyb0702-spec/doctorpet:${APP_BLUE_IMAGE_TAG:-local}
    restart: unless-stopped
    # 호스트 포트를 게시하지 않는다 — mysql·redis와 동일 원칙(리뷰 지적 P2)으로, 이제 nginx만
    # 8080을 게시하고 app-blue/app-green은 nginx가 속한 같은 compose 네트워크 안에서만
    # app-blue:8080 / app-green:8080으로 접근된다. 액추에이터(8081)도 여전히 비공개.
    env_file:
      - .env
    environment:
      <<: *app-common-env
      # 청구 감사 로그를 남길 디렉터리(PR #91, 색별 분리는 리뷰 지적 대응). 아래
      # payment-audit-logs 볼륨 안의 색별 하위 디렉터리에 마운트해, 컷오버로 어느 색이
      # 활성이든 감사 파일이 사라지지 않으면서도 blue·green이 물리적으로 다른 파일
      # (payment-audit.log)에 쓰게 한다 — logback의 SizeAndTimeBasedRollingPolicy는 같은
      # 파일에 여러 JVM이 동시에 append·롤오버하는 상황을 지원하지 않으므로, 같은 파일을
      # 공유하면 컷오버 구간에 롤오버 경합으로 로그가 유실·덮어써질 수 있다.
      AUDIT_LOG_DIR: /app/logs/blue
    volumes:
      # 청구 감사 로그 영속 볼륨 — 컨테이너 수명과 분리해 배포/재기동 후에도 사후 추적을 가능하게 한다.
      - payment-audit-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-green:
    <<: *app
    # green은 기본 프로파일에서 제외한다 — 대상을 지정하지 않은 `docker compose up -d`(로컬
    # 개발 등)가 실수로 두 색을 동시에 띄우지 않도록 하는 구조적 안전장치다(무중단 배포 문서
    # 7절 "주의사항"). 배포 스크립트처럼 서비스명을 명시하면 프로파일과 무관하게 그대로 동작한다.
    profiles: ["green"]
    image: ghcr.io/yyb0702-spec/doctorpet:${APP_GREEN_IMAGE_TAG:-local}
    # environment를 명시적으로 다시 선언한다 — YAML 병합 키(<<: *app)는 이 키를 통째로
    # app-blue에서 그대로 가져오므로, 여기서 다시 선언하지 않으면 AUDIT_LOG_DIR도 blue와
    # 똑같이 /app/logs/blue가 되어 감사 로그 파일 분리(위 AUDIT_LOG_DIR 주석 참고)가
    # 무의미해진다. 공통 값은 *app-common-env로 그대로 재사용하고 AUDIT_LOG_DIR만 바꾼다.
    environment:
      <<: *app-common-env
      AUDIT_LOG_DIR: /app/logs/green

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # 이제 호스트 포트 8080은 nginx가 갖는다 — app-blue/app-green 중 활성 색으로만 리버스
    # 프록시한다(docs/architecture/DoctorPet-무중단배포.md). 컷오버는 nginx 설정 파일을 바꾸고
    # `nginx -s reload`하는 방식이라 컨테이너 재시작 없이 순간적으로 전환된다.
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # conf.d 디렉터리째 마운트한다 — 안의 upstream-active.conf는 배포 스크립트가 서버에서
      # 직접 덮어쓰는 파일이라 git으로 추적하지 않는다(.gitignore 참고). 로컬 개발은
      # nginx/conf.d/upstream-active.conf.example을 복사해서 만든다.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # access/error 로그를 컨테이너 쓰기 레이어가 아니라 영속 볼륨에 남긴다(payment-audit-logs와
      # 같은 이유) — nginx는 blue/green과 달리 거의 재시작되지 않아 로그가 쓰기 레이어에 무기한
      # 쌓이는 걸 막고, 컨테이너가 교체돼도 이력이 남게 한다. 로테이션은 이번 범위에 포함하지
      # 않는다(운영 규모가 커지면 별도로 검토, 무중단 배포 문서 참고).
      - nginx-logs:/var/log/nginx
    # app-blue/app-green을 depends_on으로 걸지 않는다 — 걸면 `docker compose up -d nginx`가
    # (기본 프로파일인) app-blue까지 같이 시작시키려 들어, 배포 스크립트가 아직 대상 색의
    # 이미지 태그를 export하기 전 타이밍에 엉뚱한 태그(local 폴백)로 기동을 시도할 수 있다.
    # nginx는 컷오버 대상 색과 독립적으로 항상 떠 있어야 하는 서비스라 이 결합을 두지 않는 게
    # 맞다 — 업스트림이 아직 안 떠 있으면 그 사이 요청은 502를 받을 뿐, nginx 자체는 정상 기동한다.

volumes:
  mysql-data:
  payment-audit-logs:
  nginx-logs:
