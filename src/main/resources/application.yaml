spring:
  application:
    name: DoctorPet
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

# 공공데이터 OpenAPI의 공개 설정은 모든 실행 환경이 공통으로 사용합니다.
public-data:
  animal-hospital:
    base-url: https://apis.data.go.kr/1741000/animal_hospitals
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}
    seed-enabled: ${PUBLIC_DATA_SEED_ENABLED:false}
    page-size: 100
    connect-timeout: 3s
    read-timeout: 10s
    source-crs: EPSG:5174
    local-government-codes:
      - "3130000"

hospital:
  search:
    cache-ttl: ${HOSPITAL_SEARCH_CACHE_TTL:10m}

# email_verified 컬럼 추가로 인한 기존 회원 백필(리뷰 지적 P1) — 기본값 true로 두어 배포 시
# 끄는 걸 잊어서 전원 로그인 차단되는 사고를 방지한다. 마커(schema_migrations)로 1회만
# 실행되므로 계속 켜둬도 안전하다.
member:
  email-verified-backfill:
    enabled: ${MEMBER_EMAIL_VERIFIED_BACKFILL_ENABLED:true}

# 배포 헬스체크(CI/CD MVP). health 외 다른 액추에이터 엔드포인트(env, beans 등)는 민감정보를
# 노출할 수 있어 명시적으로 켜지 않는 한 웹으로 노출하지 않는다. DB·Redis 연결 상태까지
# health에 포함시켜(showDetails), 컨테이너가 뜨긴 했는데 DB에 못 붙는 상태를 배포 스크립트가
# "성공"으로 오판하지 않게 한다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
