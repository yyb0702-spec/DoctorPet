# 전체 SpringBootTest가 외부 AI 키 없이도 공통 컨텍스트를 구성하도록 테스트 전용 Fake Gateway를 사용한다.
spring:
  # 테스트 리소스가 main application.yaml을 가리므로 JPA가 엔티티 스키마를 생성하도록 명시한다.
  jpa:
    hibernate:
      ddl-auto: update

ai:
  gateway: fake

# PetService가 ImageStorageGateway를 필수 생성자 주입으로 받는데, 이 빈은
# image.storage.provider가 fake/s3일 때만 등록된다(fail-safe, 폴백 빈 없음). PetService는
# @Service라 전체 컨텍스트를 띄우는 다른 도메인의 @SpringBootTest도 컴포넌트 스캔으로 함께
# 로딩하므로, 이 값이 없으면 pet 도메인과 무관한 테스트까지 NoSuchBeanDefinitionException으로
# 컨텍스트 로딩에 실패한다(PR #133 리뷰 지적 P1). CI는 .github/workflows/ci.yml의
# IMAGE_STORAGE_PROVIDER env로 우연히 통과했을 뿐이라, 로컬 ./gradlew test·IntelliJ 실행을
# 위해 ai.gateway와 같은 방식으로 여기 전역 설정한다.
image:
  storage:
    provider: fake

# 위와 같은 이유(테스트 리소스가 main application.yaml을 가림) — cors.allowed-origins의 main
# 기본값(CORS_ALLOWED_ORIGINS 미설정 시 로컬 프론트 dev 오리진 2개)이 테스트 컨텍스트에서는
# 아예 안 보여, CorsDefaultAllowedOriginsIntegrationTest가 CI에서 raw=[](빈 값)를 읽어
# 정상 오리진까지 403으로 거부됐다(이슈 #181, CI 4차 실패). main과 동일한 플레이스홀더를
# 여기에도 둬서, CORS_ALLOWED_ORIGINS 환경변수가 없을 때의 동작이 테스트와 실제 앱 모두에서
# 같도록 맞춘다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 테스트 프로파일은 local이 아니므로 Swagger/OpenAPI를 노출하지 않는 운영 기본값을 명시한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
