# CI/CD 빌드 시간 최적화 — 이 파일이 원래 없어서 Gradle 캐싱·병렬 실행이 전부 기본값(꺼짐)으로
# 돌고 있었다. GitHub Actions의 gradle/actions/setup-gradle이 ~/.gradle 의존성·캐시 디렉터리
# 자체는 자동으로 캐시해주지만, 그 안의 태스크 출력 캐시(build cache)를 실제로 쓰려면
# org.gradle.caching이 켜져 있어야 한다 — 이 값이 없으면 매번 전부 새로 컴파일·테스트한다.

# 태스크 출력 캐시 — 입력(소스·의존성 등)이 안 바뀐 태스크는 재실행 대신 이전 출력을 그대로
# 재사용한다. setup-gradle 액션이 캐시 디렉터리를 GitHub Actions 캐시로 저장·복원해주므로,
# 이전 실행에서 이미 컴파일된 결과가 있으면(같은 소스로 다시 push하거나 문서만 바뀐 커밋 등)
# 그만큼 시간이 줄어든다.
org.gradle.caching=true

# 서로 의존하지 않는 태스크를 병렬로 실행한다. 이 프로젝트는 단일 모듈(settings.gradle 참고)이라
# 멀티 모듈만큼 극적인 효과는 아니지만, 독립적인 태스크(예: 컴파일과 별개로 도는 정적 분석·리소스
# 처리 등)가 있으면 그만큼 벌어들인다. 부작용 위험이 낮아 기본으로 켜둔다.
org.gradle.parallel=true

# configuration cache(org.gradle.configuration-cache)는 이번에 일부러 안 켰다 — 이 샌드박스에
# 네트워크 제약(services.gradle.org 접근 불가)이 있어 Gradle을 직접 실행해 QueryDSL 애노테이션
# 프로세서·Lombok과의 호환 여부를 확인할 수 없었다. 검증 못 한 설정을 CI 재구성과 한 번에
# 밀어넣으면 실패했을 때 원인이 이 설정인지 잡 분리 쪽인지 구분하기 어려워진다. 위 두 값이
# 실제 CI에서 문제없이 도는 걸 확인한 뒤, 별도로 다시 시도해볼 것.
